<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#1b2432; --muted:#697586;
  --border:#dde3ea; --border-2:#eef1f5;
  --student:#2f6fb0; --student-bg:#eaf2fb;
  --instructor:#0e8f7e; --instructor-bg:#e6f6f2;
  --admin:#6a4bd0; --admin-bg:#efeafc;
  --system:#7a8699;
  --primary:#243349; --danger:#c2483a; --ok:#0e8f7e; --warn:#c8862a;
  --radius:14px; --sidebar:#1f2a3d;
  --shadow:0 1px 2px rgba(20,30,45,.05), 0 8px 24px rgba(20,30,45,.06);
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5}
h1,h2,h3,h4{margin:0; font-weight:700}
p{margin:0}
button{font-family:inherit; cursor:pointer}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px} .center{text-align:center}
.mt{margin-top:14px}.mt2{margin-top:22px}.hidden{display:none !important}

.topbar{position:sticky; top:0; z-index:100; background:#111826; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.topbar .brand{font-weight:900; font-size:15px; display:flex; align-items:center; gap:8px}
.topbar .brand .dot{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--student),var(--admin))}
.topbar .brand small{font-weight:500; color:#8b97a8; font-size:11px}
.role-tabs{display:flex; gap:5px; background:rgba(255,255,255,.08); padding:4px; border-radius:11px}
.role-tabs button{border:0;background:transparent;color:#c6d0df;padding:7px 15px;border-radius:8px;font-size:13.5px;font-weight:700}
.role-tabs button.on{background:#fff;color:var(--ink)}
.tb-right{margin-left:auto; display:flex; gap:10px; align-items:center}
.subrole{display:flex; gap:4px; background:rgba(255,255,255,.08); padding:4px; border-radius:10px}
.subrole button{border:0;background:transparent;color:#c6d0df;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:700}
.subrole button.on.admin{background:var(--admin);color:#fff}
.subrole button.on.instructor{background:var(--instructor);color:#fff}
.reset-btn{background:rgba(255,255,255,.1);border:0;color:#c6d0df;padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700}

.wrap{max-width:1180px;margin:0 auto;padding:26px 18px 80px}
.hint-bar{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:20px}

.phone{width:340px;margin:0 auto;background:#0c1118;border-radius:40px;padding:11px;box-shadow:0 10px 40px rgba(12,17,24,.28);position:relative}
.phone .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:24px;background:#0c1118;border-radius:0 0 16px 16px;z-index:5}
.screen{background:#fff;border-radius:30px;overflow:hidden;min-height:660px;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:11px 22px 4px;font-size:12px;font-weight:700}
.pscreen{padding:18px;overflow-y:auto;flex:1}

.browser{background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow)}
.bbar{display:flex;align-items:center;gap:8px;padding:11px 15px;background:#f2f4f7;border-bottom:1px solid var(--border)}
.bbar .lights{display:flex;gap:7px}.bbar .lights i{width:12px;height:12px;border-radius:50%}
.bbar .lights i:nth-child(1){background:#f5655b}.bbar .lights i:nth-child(2){background:#f6be4e}.bbar .lights i:nth-child(3){background:#5bc862}
.bbar .url{flex:1;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 13px;font-size:12px;color:var(--muted)}
.app{display:flex;min-height:640px}
.sidebar{width:212px;flex:none;background:var(--sidebar);color:#c6d0df;padding:16px 0;display:flex;flex-direction:column}
.sb-brand{padding:0 18px 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-brand .logo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
.sb-brand b{color:#fff;font-size:15px}.sb-brand small{display:block;font-size:10.5px;color:#8794a8}
.nav{padding:12px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;font-size:13.5px;color:#c6d0df;text-decoration:none;cursor:pointer}
.nav a .ic{width:16px;text-align:center;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.nav a.locked{color:#6b7688;cursor:not-allowed}
.nav a .badge{margin-left:auto;background:var(--warn);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:1px 7px}
.sb-foot{padding:14px 18px 2px;border-top:1px solid rgba(255,255,255,.08)}
.sb-foot small{display:block;color:#8794a8;font-size:11px;margin-bottom:6px}
.role-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;font-weight:700;font-size:12px;color:#fff}
.main{flex:1;background:#fbfcfd;padding:24px 26px;overflow-x:auto;min-width:0}
.page-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:21px}.page-head .sub{font-size:13px;color:var(--muted);margin-top:3px}
.page-head .spacer{flex:1}

.btn{border:1px solid transparent;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:700;transition:.12s}
.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover{background:#1a2636}
.btn.ghost{background:#fff;border-color:var(--border);color:var(--ink)}.btn.ghost:hover{border-color:#c3ccd6}
.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:14px 18px;font-size:15px;width:100%}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.pcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:15px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.field .hint{font-size:11.5px;color:var(--muted);font-weight:400;margin-top:5px;display:block}
.input{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 13px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
.input:focus{outline:2px solid var(--student);outline-offset:1px}
textarea.input{resize:vertical;min-height:90px;line-height:1.7}
.seg-btns{display:flex;gap:8px;flex-wrap:wrap}
.seg-btns button{flex:1;min-width:64px;border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg-btns button.on{border-color:var(--primary);background:var(--primary);color:#fff}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px}
.stat .lbl{font-size:12px;color:var(--muted)}.stat .num{font-size:27px;font-weight:900;margin-top:4px}
.stat .delta{font-size:11.5px;margin-top:3px;font-weight:700}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
thead th{background:#f4f6f9;text-align:left;padding:11px 14px;font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap;border-bottom:1px solid var(--border)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border-2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.no::before{display:none}
.pill.ok{background:var(--instructor-bg);color:var(--ok)}
.pill.warn{background:#fbf1e0;color:var(--warn)}
.pill.danger{background:#fbe9e7;color:var(--danger)}
.pill.student{background:var(--student-bg);color:var(--student)}
.pill.admin{background:var(--admin-bg);color:var(--admin)}
.pill.system{background:#eef1f5;color:var(--system)}
.progress{height:8px;background:var(--border-2);border-radius:10px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--student);border-radius:10px;transition:width .3s}
.steps{display:flex;gap:6px;margin:12px 0}
.steps .st{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);padding-bottom:7px;border-bottom:3px solid var(--border)}
.steps .st.on{color:var(--student);border-color:var(--student)}
.steps .st.done{color:var(--ok);border-color:var(--ok)}
.qtag{font-size:11px;font-weight:800;color:var(--student)}
.qtext{font-size:15.5px;font-weight:700;line-height:1.55;margin:9px 0 15px}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{border:1px solid var(--border);border-radius:11px;padding:12px 14px;font-size:13.5px;display:flex;align-items:center;gap:11px;background:#fff;cursor:pointer;text-align:left;width:100%}
.choice .k{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);flex:none}
.choice.sel{border-color:var(--student);background:var(--student-bg)}
.choice.sel .k{background:var(--student);color:#fff;border-color:var(--student)}
.passage{background:var(--border-2);border:1px solid var(--border);border-radius:11px;padding:13px;font-size:12.5px;line-height:1.7;color:#33404f;margin-bottom:13px}
.player{background:var(--student-bg);border:1px solid #d3e4f6;border-radius:12px;padding:13px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.player .play{width:40px;height:40px;border-radius:50%;background:var(--student);color:#fff;border:0;font-size:15px;flex:none}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:34px}
.wave i{flex:1;background:var(--student);opacity:.5;border-radius:2px}
.timer-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700}
.rec-btn{width:78px;height:78px;border-radius:50%;background:var(--danger);border:0;color:#fff;font-size:26px;margin:0 auto;display:block;box-shadow:0 0 0 8px rgba(194,72,58,.12)}
.rec-btn.idle{background:var(--student);box-shadow:0 0 0 8px rgba(47,111,176,.12)}
.ai-card{background:linear-gradient(180deg,#f7f4fe,#fff);border:1px solid #e4dbf7;border-radius:12px;padding:14px}
.ai-card .ai-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--admin);margin-bottom:8px}
.grade-grid{display:grid;grid-template-columns:220px 1fr 250px;gap:16px}
.rubric-item{border:1px solid var(--border);border-radius:11px;padding:13px;margin-bottom:12px}
.rubric-item .ri-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;font-weight:700}
.ai-score{background:var(--admin-bg);color:var(--admin);padding:2px 9px;border-radius:20px;font-size:12px;font-weight:800}
.ai-reason{font-size:12px;color:var(--muted);line-height:1.6;background:#faf9fe;border-left:3px solid var(--admin);padding:8px 11px;border-radius:0 8px 8px 0;margin:8px 0}
.score-input{display:flex;align-items:center;gap:8px}
.score-input input{width:64px;text-align:center;font-weight:800;font-size:15px}
.vs-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.vs-num{font-size:32px;font-weight:900}.vs-lbl{font-size:11px;color:var(--muted);font-weight:700}
.discrepancy{margin-top:12px;padding:10px;border-radius:10px;font-size:12.5px;font-weight:700;text-align:center}
.discrepancy.big{background:#fbe9e7;color:var(--danger)}.discrepancy.okd{background:var(--instructor-bg);color:var(--ok)}
.stu-list{display:flex;flex-direction:column;gap:6px}
.stu-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;cursor:pointer;background:#fff;text-align:left;width:100%}
.stu-item.on{border-color:var(--admin);background:var(--admin-bg)}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tabs button{border:0;background:transparent;padding:9px 16px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--primary)}
.grade-badge{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--admin);color:#fff;font-weight:900;font-size:15px}
.grade-badge.sm{width:28px;height:28px;font-size:12px;border-radius:8px}
.radar-legend{display:flex;gap:16px;justify-content:center;font-size:12px;margin-top:8px}
.radar-legend span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.radar-legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.lock-banner{background:#fff8ee;border:1px solid #f0dcbb;border-radius:11px;padding:12px 14px;font-size:12.5px;color:#8a6414;display:flex;gap:9px;align-items:flex-start}
.info-banner{background:var(--student-bg);border:1px solid #cfe1f5;border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--student)}
.dropzone{border:2px dashed var(--border);border-radius:12px;padding:26px 16px;text-align:center;color:var(--muted);background:#fbfcfd;cursor:pointer}
.dropzone .big{font-size:30px;margin-bottom:6px}
.dropzone:hover{border-color:var(--student);color:var(--student)}
.ocr-preview{border:1px dashed var(--student);border-radius:11px;padding:12px;font-size:13px;line-height:1.9;background:#fbfdff}
.ocr-preview .bad{background:#fbe9e7;color:var(--danger);border-radius:4px;padding:0 3px;font-weight:700;text-decoration:underline dotted;cursor:pointer}
.photo-thumb{width:56px;height:72px;border-radius:8px;background:linear-gradient(135deg,#dbe6f2,#c3d4e8);display:grid;place-items:center;font-size:24px;flex:none}
.chk-inline{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;padding:10px 0;cursor:pointer}
.chk-inline input{width:17px;height:17px;accent-color:var(--student)}
/* 서비스 도식 */
.flow{max-width:800px;margin:0 auto;padding-bottom:20px}
.flow-legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:22px;font-size:12px}
.flow-legend span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.flow-legend i{width:13px;height:13px;border-radius:4px;display:inline-block}
.fnode{border-radius:14px;padding:13px 16px;border:1px solid;box-shadow:var(--shadow)}
.fnode .frole{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;display:inline-block;padding:2px 9px;border-radius:20px;margin-bottom:7px}
.fnode .ftitle{font-size:14.5px;font-weight:700}
.fnode .fdesc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.65}
.f-admin{background:var(--admin-bg);border-color:#ddd0f5}.f-admin .frole{background:var(--admin);color:#fff}
.f-student{background:var(--student-bg);border-color:#cfe1f5}.f-student .frole{background:var(--student);color:#fff}
.f-instr{background:var(--instructor-bg);border-color:#bfe6dc}.f-instr .frole{background:var(--instructor);color:#fff}
.f-system{background:#eef1f5;border-color:var(--border)}.f-system .frole{background:var(--system);color:#fff}
.farrow{text-align:center;color:#9aa6b6;font-size:20px;line-height:1;padding:5px 0;font-weight:700}
.fbranch{display:flex;gap:14px;align-items:stretch}.fbranch>div{flex:1;display:flex;flex-direction:column}
.fbranch .blabel{text-align:center;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:8px}
.fsplit{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:5px 0}
@media(max-width:640px){.fbranch{flex-direction:column}}
.perm-note{font-size:12px;color:var(--muted);background:var(--border-2);border-radius:9px;padding:9px 12px;margin-top:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:300;box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.modal-overlay{position:fixed;inset:0;background:rgba(15,22,33,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .m-ic{font-size:38px}.modal h3{font-size:17px;margin:12px 0 6px}.modal p{font-size:13px;color:var(--muted);margin-bottom:18px}
.modal .m-btns{display:flex;gap:10px}.modal .m-btns .btn{flex:1}
@media (max-width:820px){
  .grade-grid{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}
  .app{flex-direction:column}.sidebar{width:100%}.nav{flex-direction:row;flex-wrap:wrap}
  .phone{width:100%;max-width:360px}
}
</style>


<div class="topbar">
  <div class="brand"><span class="dot"></span> 배치고사 <small>온라인글로벌한국어능력시험 (IBT/CBT) · MVP</small></div>
  <div class="role-tabs" id="roleTabs">
    <button data-role="student" class="on">🎓 학생 응시</button>
    <button data-role="staff">🖥️ 관리자·강사</button>
    <button data-role="flow">🗺️ 서비스 도식</button>
  </div>
  <div class="tb-right">
    <div class="subrole hidden" id="subRole">
      <button data-sub="admin" class="on admin">관리자</button>
      <button data-sub="instructor" class="instructor">강사</button>
    </div>
    <button class="reset-btn" onclick="resetAll()">↻ 처음부터</button>
  </div>
</div>

<div class="wrap">
  <div class="hint-bar" id="hintBar"></div>
  <div id="app"></div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="m-ic" id="mIc">📝</div>
    <h3 id="mTitle">정말 제출하시겠습니까?</h3>
    <p id="mBody"></p>
    <div class="m-btns"><button class="btn ghost" onclick="closeModal()" id="mNo">아니요</button><button class="btn primary" id="mYes">네</button></div>
  </div>
</div>

<script>
/* 연세 온라인 글로벌 한국어 평가 · 실제 문항 은행 (1~4회차 발췌)
   출처: 연세대 제공 엑셀/HWP. 어휘·문법 정답은 파일에 키가 없어 추정치이며 공식 확인 필요. */
window.BANK = {"listening": {"1": [{"level": "1하","script": "이름이 무엇입니까?","q": "1. 질문을 듣고 알맞은 답을 고르십시오.","choices": ["에릭이 있습니다.","에릭이 아닙니다.","네, 저는 에릭입니다.","제 이름은 에릭입니다."],"answer": 3},{"level": "1중","script": "여자: 어서 오세요. 뭘 찾으세요?\n남자: 바지를 한 벌 사고 싶어요.\n여자: 이건 어때요? 싸고  좋아요.","q": "3. 여기는 어디입니까?","choices": ["옷 가게","꽃 가게","편의점","문구점"],"answer": 0},{"level": "1중","script": "여행을 자주 가세요?","q": "4. 질문을 듣고 알맞은 답을 고르십시오.","choices": ["비행기가 빨라서 비행기로 가요.","날씨가 좋아서 내일 등산을 가요.","네, 쉬고 싶어서 여행을 안 가요.","아니요, 바빠서 자주 가지 못해요."],"answer": 3},{"level": "1상","script": "남자: 유나 씨, 이번 주 토요일에 명동에 갈까요?\n여자: 좋아요. 구경을 한 후에 명동역 근처에 있는 한식집에서 저녁도 먹읍시다. \n남자: 그럼 열 두 시에 학교 앞에서 만나서 같이 가는 게 어때요?\n여자: 그래요. 정말 재미있을 것 같아요.","q": "6. 여자는 토요일에 무엇을 합니까?","choices": ["12시에 남자와 공부를 합니다.","남자를 만나서 명동에 갑니다.","학교 앞에 있는 한식집에 갑니다.","밥을 먹고 명동을 구경하러 갑니다."],"answer": 1}],"2": [{"level": "2하","script": "여자: 한번 드셔 보세요. 세일 기간이라서 싸게 사실 수 있어요.\n남자: 맵지 않은가요? 제가 매운 음식을 잘 못 먹어서요.\n여자: 별로 맵지 않아요. 어린아이들도 잘 먹어요.","q": "2. 대화를 듣고 내용과 같은 것을 고르십시오.","choices": ["남자는 매운 음식을 좋아합니다.","남자는 음식의 맛을 묻고 있습니다.","여자는 아이들에게 음식을 팝니다.","여자와 남자는 같이 일하고 있습니다."],"answer": 1},{"level": "2중","script": "여자: 우진 씨는 주로 어디에서 옷을 사요?\n남자: 저는 보통 인터넷으로 검색해서 사요. 이 티셔츠도 인터넷 쇼핑으로 싸게 산 거예요.\n여자: 잘 어울리네요. 저한테도 그 홈페이지 주소 좀 알려 주실래요?\n남자: 네, 제가 좋은 데 몇 개 알려 드릴 테니까 한번 들어가 보세요.","q": "3. 대화를 듣고 무엇에 대해 이야기하는지 고르십시오.","choices": ["남자가 쇼핑하는 방법","여자에게 어울리는 옷","한국에서 쇼핑한 경험","친구가 골라 준 티셔츠"],"answer": 0},{"level": "2중","script": "여자: 크리스마스에 반 친구들하고 파티하려고 하는데 너도 올 수 있어?\n남자: 재미있겠다. 파티는 어디에서 할 거야? \n여자: 식당 예약이 어려울 것 같아서 우리 집에서 할까 해. \n남자: 좋아. 그럼, 음식은 다 같이 만들어서 먹으면 어떨까? 케이크는 내가 사 가지고 갈게.","q": "4. 대화를 듣고 내용과 같은 것을 고르십시오.","choices": ["남자는 친구들을 집으로 초대하려고 한다.","남자는 친구와 먹을 케이크를 사려고 한다.","여자는 파티를 할 식당을 예약하려고 한다.","여자는 파티 음식을 미리 결정하려고 한다."],"answer": 1},{"level": "2상","script": "여자: 우진 씨 고향이 부산이지요? 부산역에서 국제 시장까지 가려면 어떻게 가야 해요?\n남자: 지하철로 가면 돼요. 부산역 앞에서 버스를 타도 되는데 버스 정류장을 찾기가 쉽지 않을 거예요. 그 시장 근처에 새로 생긴 서점 거리도 유명하다고 하니까 한번 가 보세요. 커피를 마시면서 책도 읽을 수 있을 거예요.","q": "5. 대화를 듣고 내용과 다른 것을 고르십시오.","choices": ["여자는 시장에 어떻게 가는지 잘 모른다.","부산역 앞의 버스 정류장은 찾기가 어렵다.","부산역 근처에 있는 서점 거리가 유명하다.","서점에서 커피도 마시고 책도 읽을 수 있다."],"answer": 2},{"level": "2상","script": "여자: 오늘 점심은 뭐 먹을까?\n남자: 한 시부터 회의가 있으니까 밖에 나가지 말고 배달시키자.  \n여자: 배달 음식은 오는 동안 식어서 별로 맛이 없어. 메뉴도 다양하지 않고.  \n남자: 지난주에 내가 시켜 먹었던 데는 음식도 맛있는 데다가 값도 싸고 음료수도 서비스로 주던데. \n         기다리는 동안 회의 준비도 할 수 있으니까 오늘은 그냥 배달시켜서 먹자.","q": "6. 대화를 듣고 남자의 생각을 고르십시오.","choices": ["점심시간이 끝난 후에 회의를 시작했으면 좋겠다.","음식이 식기 전에 점심을 맛있게 먹었으면 좋겠다.","음식이 맛없어도 값이 싼 식당에서 시켰으면 좋겠다.","회의가 있으니까 점심에 배달시켜 먹었으면 좋겠다."],"answer": 3}],"3": [{"level": "3하","script": "안녕하세요? 오늘 첫 번째 발표를 맡은 김유나입니다. 한국 드라마는 다양한 주제로 사회 문제에 대해 이야기하면서도 재미와 감동까지 전하기 때문에 인기가 많다고 생각합니다. 드라마의 인기 덕분에 주인공이 입었던 옷이나 사용했던 화장품이 많이 팔리기도 합니다. 또 드라마 장면을 잊지 못하는 사람들을 위해서 드라마 촬영지를 관광지로 남겨 놓기도 하고요, 인기 있는 드라마는 영화나 뮤지컬로 다시 만들어지기도 합니다.","q": "1. 무엇에 대한 발표인지 고르십시오.","choices": ["한국 드라마의 주제","한국 드라마의 인기","한국 드라마의 촬영지","한국 드라마의 주인공"],"answer": 0},{"level": "","script": "","q": "2. 들은 내용과 같은 것을 고르십시오.","choices": ["한국 드라마는 재미보다는 감동을 중요하게 생각한다.","드라마 덕분에 유명해진 배우는 드라마를 잊지 못한다.","인기가 많았던 드라마는 영화나 뮤지컬로 다시 만들어진다.","유명한 관광지는 드라마 촬영 장소로 자주 이용되고 있다."],"answer": 3},{"level": "3중","script": "남자: 시험 다 끝났지? 근데 어디 아파? 안색이 안 좋아 보이는데.\n여자: 응, 머리가 아파. 지난주부터 계속 아팠는데 약을 먹으니까 참을 만했거든. 근데 심해졌어.\n남자: 시험 때문에 계속 참았구나. 빨리 병원부터 가 봐.  \n여자: 응, 그런데 지금은 강의도 들으러 가야 되고 이따가 저녁에는 교수님과 상담 약속도 잡혀 있어.   \n남자: 그럼 지금 전화해서 예약해 놓고 상담하러 가기 전에 잠깐 들르면 되잖아.\n여자: 그래, 그래야겠다. 고마워.","q": "3. 들은 내용과 같은 것을 고르십시오.","choices": ["남자는 여자의 건강을 걱정하고 있다.","남자는 여자와 함께 상담하러 갈 것이다.","여자는 오늘 저녁 늦게까지 강의가 있다.","여자는 약속 때문에 계속 병원에 못 갔다."],"answer": 1},{"level": "","script": "","q": "4. 여자가 이어서 할 행동으로 알맞은 것을 고르십시오.","choices": ["시험을 본다.","강의를 듣는다.","교수를 만나러 간다.","병원에 전화를 한다."],"answer": 2},{"level": "3상","script": "(딩동댕동)잠시 안내 말씀드리겠습니다. 오늘 오후 한 시부터 세 시까지 정문 안내소 옆에 있는 물놀이터에서 물고기 잡기 대회가 열립니다. 이 행사는 낚싯대라든가 그물은 사용하지 않고 손으로 물고기를 잡는 대회입니다. 물고기를 가장 많이 잡은 분뿐만 아니라 가장 큰 물고기를 잡은 분께도 상품을 드립니다. 또 행사가 끝난 후에는 잡은 물고기를 들고 기념 촬영도 하실 수 있습니다. 참가를 희망하시는 분은 열 두 시 삼십 분까지 물놀이터 앞으로 오시면 됩니다. 이 행사는 안전을 위해서 중학생 이상만 참가하실 수 있습니다. 고맙습니다.","q": "5. 무엇에 대한 안내 방송인지 고르십시오.","choices": ["물고기 잡기 대회 안내","물놀이터 이용 방법 안내","행사장 안내소 위치 안내","행사 기념 촬영 신청 안내"],"answer": 1},{"level": "","script": "","q": "6. 안내 방송을 잘 이해한 사람을 고르십시오.","choices": ["미연: 나는 초등학교 5학년이라서 참가 못하겠네.","승호: 재미있는 행사인데 상품이 없어서 좀 아쉽다.","나리: 나도 참가하고 싶은데 낚싯대는 어디에서 사지?","우진: 점심을 먹고 나서 3시까지 물놀이터에 가 보자."],"answer": 2}],"4": [{"level": "4하","script": "남자: 며칠 전에 우리 아파트에 '나눔 공간'이란 곳이 생겼는데 생각보다 괜찮은 것 같아. 여기에 재사용 가능한 물건을 갖다 놓으면 필요한 사람이 가져가는 거거든.\n여자: 그럼 사람들이 안 쓰는 물건을 거기에 마구 가져다 놓을 텐데 너무 지저분해지지 않을까? \n남자: 나도 처음엔 걱정했는데 사람들이 생각보다 적극적으로 활용하더라고. 다들 그동안 이런 기회가 없어서 다시 사용할 수 있는 물건들도 그냥 쓰레기로 버렸던 것 같아. 앞으로 이런 '나눔 공간'이 더 많이 생겼으면 좋겠어.","q": "1. 남자의 중심 생각으로 알맞은 것을 고르십시오.","choices": ["필요한 물건은 사지 말고 서로 바꿔 써야 한다.","쓰레기를 버릴 수 있는 장소가 많아져야 한다.","팔 물건은 지저분해지지 않게 관리해야 한다.","물건을 재사용할 수 있는 기회를 늘려야 한다."],"answer": 3},{"level": "","script": "","q": "2. 들은 내용과 같은 것을 고르십시오.","choices": ["나눔 공간을 활용하지 못하는 것이 문제이다.","나눔 공간에서 필요한 것을 발견하기 어렵다.","나눔 공간에 쓰레기를 갖다 놓는 사람이 많다.","나눔 공간은 생긴 지 그리 오래되지 않았다."],"answer": 3},{"level": "","script": "","q": "4. 외국인 관광객이 제주도를 선택한 이유가 아닌 것을 고르십시오.","choices": ["자연을 감상할 수 있어서","호텔의 시설이 깨끗해서","항공사의 서비스가 좋아서","해양 스포츠 비용이 저렴해서"],"answer": 2},{"level": "4상","script": "남자: 안녕하세요? 요즘 같은 계절엔 바쁘시겠어요. 주로 어떤 일을 하시는지요? \n여자: 요즘처럼 야외 활동하기 좋은 때에는 정말 눈코 뜰 새 없이 바빠요. 저는 숲이나 수목원을 찾는 방문객들에게 숲과 자연에 대해 설명하는 일을 합니다. 숲속에 사는 동식물과 곤충이 인간에게 어떤 영향을 미치는지도 설명하고요. 특히 봄 가을에는 유치원생들이 체험 활동을 하러 방문하는 경우가 많은데요, 어린아이들이 오는 경우에는 숲에서 곤충을 찾아 직접 만져보게 한다든가 나뭇잎을 활용해서 다양한 만들기 활동을 진행한다든가 하면서 자연을 직접 느낄 수 있도록 도와줍니다.","q": "5. 여자가 하는 일로 알맞은 것을 고르십시오.","choices": ["식물학자","숲 체험 교사","곤충 연구원","공원 관리인"],"answer": 1},{"level": "","script": "","q": "6. 들은 내용과 다른 것을 고르십시오.","choices": ["여자는 아이들이 자연을 체험할 수 있게 돕는다.","여자는 자연이 인간에게 미치는 영향을 설명한다.","여자는 주로 숲이나 수목원 같은 야외에서 일한다.","여자는 계절에 상관없이 일 년 내내 바쁘게 일한다."],"answer": 3}],"5": [{"level": "5하","script": "기자: 오늘 한강 공원에서는 서울시 다문화센터가 마련한 ‘따로, 또 같이’ 축제가 열리고 있습니다. 다문화 가족과 이주 노동자들이 참여해서 세계 각 지역의 문화를 소개하는 행사인데요. 보시다시피 오늘 행사장에 방문한 시민들이 아주 많습니다. 행사장에서는 필리핀과 러시아의 수공예품을 직접 제작해 보고 베트남, 중국, 일본 등 여러 나라의 음식을 맛볼 수도 있습니다. 이뿐만 아니라 각국의 전통 의상도 입어 볼 수 있는데요. 올해는 특별히 축제 10년째를 맞아서 전통 의상을 입고 사진을 찍어 SNS에 올리면 추첨을 통해 상품을 받는 이벤트도 진행되고 있습니다.","q": "1. 무엇에 대한 이야기인지 고르십시오.","choices": ["세계 각국의 전통 의상 패션쇼","다문화 이해를 위한 체험 행사","이주 노동자의 공예품 전시회","다문화 가정을 위한 특별 수업"],"answer": 1},{"level": "","script": "","q": "2. 들은 내용과 같은 것을 고르십시오.","choices": ["행사장에서 베트남 음식을 직접 요리해 볼 수 있다.","이 행사는 올해 처음 열려서 언론의 주목을 받았다.","특별 이벤트에 참여하는 사람 모두에게 상품을 준다.","행사장에서 필리핀의 수공예품을 만들어 볼 수 있다."],"answer": 3},{"level": "5중","script": "남자: 학습 효과를 높이기 위해서는 학습자의 흥미를 이끌어 내는 게 가장 중요하다고 봅니다. 학습자들의 관심을 끄는 수단으로 스마트폰이라든가 태블릿 PC 같은 스마트 기기만한 것이 없는데요. 스마트 기기의 교육적 효과는 여러 연구를 통해서 이미 증명된 사실입니다.\n여자: 물론 학습 초기에는 스마트 기기가 공부에 잠깐 흥미를 갖게 하지요. 하지만 실제 학습 효과를 높인다고 보긴 어렵습니다. 오히려 학생들의 집중력을 떨어뜨려서 학습을 방해할 가능성이 높습니다. 디지털 치매라는 말이 생겨난 것처럼 디지털 기기가 인간의 사고 능력을 떨어뜨린다고 지적한 연구도 다수 있고요. 스마트 기기가 상상력과 창의력 개발에 어떤 긍정적 영향을 줄 수 있을지 정말 의문입니다.","q": "3. 여자의 태도로 알맞은 것을 고르십시오.","choices": ["연구 결과를 근거로 남자의 의견을 추가로 보완하고 있다.","남자의 주장에 대해 부정적인 시각으로 반론을 펴고 있다.","남자의 의견을 강하게 반박하며 청중의 동의를 구하고 있다.","남자의 주장을 인정한 후에 실효성 있는 대책을 제시하고 있다."],"answer": 1},{"level": "","script": "","q": "4. 들은 내용과 같은 것을 고르십시오.","choices": ["스마트 기기 사용은 상상력과 창의력 향상에 도움을 준다.","스마트 기기 사용은 학습 과정 내내 집중도를 유지시킨다.","스마트 기기 사용은 디지털 치매를 예방하는 효과가 있다.","스마트 기기 사용은 학습 초기의 흥미를 끄는 데 유효하다."],"answer": 3},{"level": "5상","script": "남자: 요즘 새싹 보리가 건강식품으로 주목을 많이 받고 있는데요. 새싹 보리는 십오 센티미터 정도 자란 어린 보리 잎을 말합니다. 다양한 영양소들이 풍부하게 들어 있을뿐더러 각종 성인병이나 비만을 예방하는 데도 효과가 있습니다. 그런데 여러분, 이 새싹 보리를 섭취할 때 주의할 점이 있습니다. 새싹 보리 효능이 뛰어나다고 너무 많은 양을 섭취하시면 안 됩니다. 복통이나 설사 같은 부작용이 생길 수 있기 때문입니다. 그리고 새싹 보리를 집에서 직접 키워서 먹을 수도 있지만 간편하게 분말 형태로 된 제품을 구입해서 먹을 수도 있는데요. 새싹 보리를 구입해 드시는 경우 식품 안전성 검사를 통과한 제품인지 반드시 확인하셔야 합니다. 오늘 말씀드린 주의 사항을 꼭 기억하셔서 안전하게 섭취하시기 바랍니다.","q": "5. 남자의 중심 생각으로 알맞은 것을 고르십시오.","choices": ["새싹 보리 제품의 안전성 검사를 엄격하게 해야 한다.","간편하게 먹을 수 있는 새싹 보리 제품을 개발해야 한다.","새싹 보리 효능에 대한 연구가 활발하게 이루어져야 한다.","새싹 보리를 올바르게 섭취하는 방법을 알고 먹어야 한다."],"answer": 3},{"level": "","script": "","q": "6. 들은 내용과 같은 것을 고르십시오.","choices": ["오래 전부터 새싹 보리는 건강식품으로 인기가 많았다.","새싹 보리는 부작용을 일으키지 않는 안전한 식품이다.","새싹 보리를 섭취하면 성인병과 비만 예방에 도움이 된다.","새싹 보리는 다 자란 보리에서 잘라 낸 작은 잎을 가리킨다."],"answer": 2}],"6": [{"level": "6하","script": "안녕하십니까? ‘공유 경제’라는 주제로 발표를 맡은 김유나입니다. 여러분, 요즘 전동 킥보드 많이들 타시나요? 그럼 혹시 킥보드를 직접 구매하셨나요? 아마 대부분 대여해서 타셨을 겁니다. 이제 물건은 더 이상 개인 소유의 개념이 아니라 타인과 함께 공유하는 시대가 됐습니다. 이런 공유 개념은 사용자 입장에서는 저비용, 고효율의 이점이 있고, 공급자는 소득을 올릴 수 있다는 장점이 있습니다. 하지만 주로 인터넷이라는 가상공간에서 거래가 이루어지다 보니 사용자는 물건이나 서비스의 질을 보장받기 힘들고, 공급자는 사용자의 부주의로 인해 피해를 보는 사례도 적지 않습니다. 이런 공유 경제의 허점을 교묘하게 악용하는 사례가 늘고 있는 만큼 제도적으로 보다 확실한 보완책이 마련돼야 합니다.","q": "1. 발표의 제목으로 알맞은 것을 고르십시오.","choices": ["공유 경제 활동의 피해 구제 대책","공유 경제의 지속적인 발전 가능성","공유 경제의 개념과 실제 사례 분석","공유 경제의 제도적 보완을 위한 노력"],"answer": 3},{"level": "","script": "","q": "2. 들은 내용과 같은 것을 고르십시오.","choices": ["인터넷 상거래의 허점을 악용하는 사람이 많다.","공유 물품 공급자는 비용 절감 효과를 보게 된다.","공유 경제는 공급자보다 사용자에게 더 유리하다.","물건을 개별 소유하려는 소비 경향이 여전히 높다."],"answer": 0},{"level": "6중","script": "여자: 7-80대 고령 운전자의 교통사고 발생률이 해마다 증가하고 있는 가운데 정부는 다양한 대책을 마련하고 있는데요. 그 일환으로 70세 이상의 고령 운전자가 면허를 자발적으로 반납하는 경우 10만 원 상당의 교통카드를 지급하는 사업을 진행하고 있습니다.\n남자: 그런데 운전을 포기하는 대가로 교통카드를 받으려는 분들이 과연 얼마나 될까요? 운전자들은 대체로 활동 범위가 넓은 편인데 이런 분들이 제한된 금액의 교통카드로 마음껏 이동하는 데는 한계가 있습니다. 그래서 이 사업이 고령 운전자에게 별로 매력적이지 않을 수 있다는 겁니다. 따라서 고령자의 운전을 무조건 막을 게 아니라 안전하게 운전할 수 있는지 여부를 정밀하게 검사해 가지고 사고의 위험도를 낮추는, 실질적인 대책이 필요하다고 생각합니다.","q": "3. 남자와 같은 의견을 가진 사람을 고르십시오.","choices": ["우진: 10만 원짜리 교통카드를 받을 바에야 계속 운전을 하고 다니는 게 낫겠어.","나리: 교통카드 지급액을 높여서라도 고령자의 면허 반납을 더 활성화시켜야 해.","승호: 고령자가 자가용 없이도 이동에 불편함이 없게 대중교통 수단을 더 늘려야겠지.","미연: 단지 나이가 많다고 해서 그들에게 운전할 자유를 빼앗는 것은 인권 침해라고 봐."],"answer": 0},{"level": "","script": "","q": "4. 들은 내용과 같은 것을 고르십시오.","choices": ["정부는 70세 이상 운전자의 면허 반납을 의무화하고 있다.","면허를 반납하고 받는 교통카드는 무제한 이용이 가능하다.","고령자의 운전을 제한하는 것만이 최선의 해결책은 아니다.","정부의 교통사고 줄이기 캠페인에 동참하는 운전자가 많다."],"answer": 2},{"level": "6상","script": "지금 제가 서 있는 이곳은 평범한 굴처럼 보이지만 자세히 들여다보면 노랗게 반짝이는 무언가가 보이는데요. 네, 여기는 바로 금광입니다. 한국은 한때 세계 3위의 금 생산국이었지만 환경 문제로 인해 대부분의 광산이 문을 닫게 됐습니다. 그럼 지금 우리가 사용하는 금은 어디에서 구하는 걸까요? 바로 우리 주변에 있는 전자 제품에서 금을 구합니다. 잘 상상이 안 되시죠? 수명이 다하거나 버려지는 전자기기에 각종 금속 자원이 들어 있습니다. 이 금속 자원을 추출해서 재사용하는 건데요. 실제 광산에서 채굴하는 자원보다 100배 이상의 효율을 올릴 수 있다고 합니다. 지구에 매장되어 있는 자원의 한계를 생각한다면 폐자원을 재사용하는 산업의 가치에 대해 새롭게 주목해야 할 때가 온 것 같습니다.","q": "5. 이야기의 중심 내용으로 맞는 것을 고르십시오.","choices": ["폐자원을 재활용하는 산업에 대해 관심을 가져야 한다.","전자 제품의 수명을 늘려서 금속 사용량을 줄여야 한다.","금광 채굴 산업을 다시 활성화시킬 대책을 세워야 한다.","환경 오염을 막기 위해 자연자원 발굴을 중단해야 한다."],"answer": 0},{"level": "","script": "","q": "6. 들은 내용과 같은 것을 고르십시오.","choices": ["최근 폐금광이 많아지면서 금 생산에 어려움을 겪고 있다.","매장된 자원을 개발하는 것이 금 채굴의 이상적인 방법이다.","한국은 폐자원 활용 산업 분야에서 세계적으로 선두에 있다.","폐가전의 금 추출 방식은 광산 채굴 방식보다 효율성이 높다."],"answer": 3}]},"reading": {"1": [{"level": "","q": "제 방에 침대가 있습니다. 침대 옆에 책상도 있습니다. 거울하고 시계는 없습니다. 옷걸이도 없습니다.\n\n2. 방에 무엇이 있습니까?","choices": ["거울이 방에 있습니다.","옷걸이가 방에 있습니다.","방에 시계가 있습니다.","방에 책상이 있습니다."],"answer": 3},{"level": "중","q": "저는 야구를 좋아해서 야구를 자주 합니다. 그리고 집에서 요가도 합니다. 야구와 요가는 어렵지 않고 재미있습니다.\n\n3. 무슨 이야기입니까?","choices": ["운동","공부","산책","게임"],"answer": 0},{"level": "","q": "주말에 친구와 같이 동대문 시장에 갔습니다. 동대문 시장은 값이 싸고 물건이 많았습니다. 저는 시장에서 티셔츠와 구두를 샀습니다. 친구는 바지를 샀습니다. \n\n4. 무슨 이야기입니까?","choices": ["물건","영화","쇼핑","친구"],"answer": 2},{"level": "상","q": "에릭은 제가 스페인 여행에서 만난 미국 사람입니다. 에릭은 지난달에 저를 보러 한국에 왔습니다. 에릭은 축구를 좋아해서 주말마다 저와 함께 축구를 합니다. 이번 주말에 우리는 서울 팀의 축구 경기를 보러 갈 겁니다.\n\n5. 글을 읽고 다른 것을 고르십시오.","choices": ["저는 에릭을 스페인에서 만났습니다.","에릭은 경기를 하러 한국에 왔습니다.","에릭은 주말마다 저와 같이 축구를 합니다.","저는 이번 주말에 에릭과 축구를 보겠습니다."],"answer": 1},{"level": "","q": "한국에서는 3월부터 5월까지가 봄입니다. 봄은 날씨가 맑고 따뜻합니다. 날씨가 따뜻해서 예쁜 꽃도 많이 핍니다. 저는 아름다운 경치를 구경하고 싶어서 등산을 갔습니다. 산에는 봄꽃 구경을 하러 온 사람들이 많았습니다. 저는 산에서 김밥도 먹고 꽃 사진도 많이 찍었습니다.\n\n6. 글을 읽고 다른 것을 고르십시오.","choices": ["한국의 봄은 날씨가 좋지 않습니다.","한국의 봄은 삼월부터 오월까지입니다.","봄이 되면 사람들은 꽃구경을 갑니다.","저는 산에 가서 꽃 사진을 찍었습니다."],"answer": 0}],"2": [{"level": "하","q": "1. 그림과 다른 것을 고르십시오.","choices": ["이 두 사람은 따로 앉아야 합니다.","이 사람은 영화표를 싸게 샀습니다.","이 영화 제목은 아름다운 세계입니다.","이 영화는 열 시부터 백 분 동안 합니다."],"answer": 0},{"level": "","q": "2. 그림과 다른 것을 고르십시오.","choices": ["사흘 동안 먹을 약을 받았습니다.","약은 하루에 두 번 먹어야 합니다.","식사하기 전에 약을 먹어야 합니다.","우진은 감기 때문에 약을 샀습니다."],"answer": 2},{"level": "중","q": "㉠ 저는 한국에 온 지 1년이 되었지만 한국에서 여행을 해 본 적이 없었습니다. ㉡ 한국에 가 보고 싶은 곳이 많았는데 특히 경주에 가 보고 싶었습니다. ㉢ 지난 주말에 경주에서 한국의 유적지를 구경하면서 한국의 역사에 대해서 더 공부하고 싶어졌습니다. ㉣ 1박 2일의 짧은 여행이었지만 즐거운 시간이었습니다. \n\n3. 글을 읽고 <보기>의 문장이 들어갈 곳을 고르십시오.\n\n<보기> 경주는 한국의 역사를 배울 수 있는 곳이기 때문입니다.","choices": ["㉠","㉡","㉢","㉣"],"answer": 2},{"level": "","q": "4. 글과 다른 것을 고르십시오","choices": ["유나는 토요일에 언제든지 우진을 만날 수 있다.","유나는 우진의 생일이 몇 월 며칠인지 알고 있다.","유나는 우진에게 줄 선물을 사는 것을 잊어버렸다.","유나는 우진의 생일을 축하하려고 밥을 살 것이다."],"answer": 2},{"level": "상","q": "㉠ 맛을 보고 간장이나 소금을 넣고 간을 맞추면 요리가 끝난다. \n㉡ 김치찌개는 한국 사람들에게 아주 익숙한 음식이다. \n㉢ 그런데 김치찌개를 잘 모르는 외국 사람도 만들기가 별로 어렵지 않다.\n㉣ 먼저 김치와 돼지고기를 작게 썰어서 볶은 후에 물을 붓고 끓인다.\n\n5. 글을 순서대로 맞게 적은 것을 고르십시오.","choices": ["㉡-㉢-㉣-㉠","㉡-㉣-㉢-㉠","㉣-㉡-㉠-㉢","㉣-㉠-㉡-㉢"],"answer": 0},{"level": "","q": "요즘 사진 동호회 모임이 아주 재미있다. 나는 사진을 잘 못 찍어서 그동안 풍경 사진만 찍었는데 지난주부터 얼굴 사진을 예쁘게 찍는 방법을 가르쳐 주니까 모임 날이 더 기다려진다. 동호회는 매주 일요일에 모임을 한다. 그런데 이번 주 모임은 올 수 없는 사람이 많아서 취소되었다. 새로 산 카메라로 사진을 찍으려고 기대했는데 할 수 없이 다음 주까지 기다려야겠다.\n\n6. 글을 읽고 내용이 같은 것을 고르십시오.","choices": ["이 사람은 사진을 잘 찍어서 동호회에 들어갔다.","이 사람은 이번 주에는 동호회 모임에 가지 않는다.","이 사람은 동호회에서 사용하려고 카메라를 빌렸다.","이 사람은 풍경 사진 찍는 방법을 배우고 싶어 한다."],"answer": 1}],"3": [{"level": "하","q": "1. 왜 이 글을 썼습니까? 알맞은 것을 고르십시오.","choices": ["오피스텔에서 살 사람을 구하기 위해서","오피스텔에서 일할 직원을 구하기 위해서","오피스텔을 소개할 회사를 알아보기 위해서","오피스텔에서 사용할 가구를 알아보기 위해서"],"answer": 0},{"level": "","q": "2. 글의 내용과 같은 것을 고르십시오.","choices": ["시설을 잘 갖추고 있어서 관리비가 좀 비싸다.","근처 공원에 가려면 지하철로 오 분 정도 걸린다.","이 집으로 이사하면 가전제품을 모두 사야 한다.","지하철로 출퇴근하는 사람들에게 편리한 집이다."],"answer": 3},{"level": "중","q": "지난주는 입학하고 세 번째 맞는 수강 신청 기간이었다. 나는 1학년 때처럼 번호를 받고 기다리면 되는 줄 알았다. ㉠ 하지만 2학년부터는 다른 방법으로 수강 신청을 해야 한다는 것을 알고 당황스러웠다. ㉡ 내가 교수님께 수강 신청에 대해 여쭤보니까 선배들에게 물어보면 도움을 받을 수 있을 거라고 하셨다. ㉢ 선배가 방법을 가르쳐 준 덕분에 내가 듣고 싶은 과목을 모두 수강 신청할 수 있었다. ㉣ 나도 선배가 되면 후배들에게 대학 생활을 잘할 수 있게 조언을 많이 해 줄 것이다. \n\n3. 글을 읽고 <보기>의 문장이 들어갈 곳을 고르십시오.\n\n<보기> 선배는 나에게 꼭 들어야 하는 과목과 그렇지 않은 과목을 나누어서 신청하는 방법을 알려 주었다.","choices": ["㉠","㉡","㉢","㉣"],"answer": 2},{"level": "","q": "지난주는 입학하고 세 번째 맞는 수강 신청 기간이었다. 나는 1학년 때처럼 번호를 받고 기다리면 되는 줄 알았다. ㉠ 하지만 2학년부터는 다른 방법으로 수강 신청을 해야 한다는 것을 알고 당황스러웠다. ㉡ 내가 교수님께 수강 신청에 대해 여쭤보니까 선배들에게 물어보면 도움을 받을 수 있을 거라고 하셨다. ㉢ 선배가 방법을 가르쳐 준 덕분에 내가 듣고 싶은 과목을 모두 수강 신청할 수 있었다. ㉣ 나도 선배가 되면 후배들에게 대학 생활을 잘할 수 있게 조언을 많이 해 줄 것이다. \n\n4. 글의 내용과 다른 것을 고르십시오.","choices": ["교수님께 대학 생활에 대한 조언을 부탁했다.","1학년 때는 어렵지 않게 수강 신청을 잘 했다.","선배님 덕분에 원하는 과목을 다 듣게 되었다.","1학년과 2학년은 수강 신청 방법이 같지 않다."],"answer": 0},{"level": "상","q": "나라마다 문화가 다르기 때문에 그 나라의 문화를 미리 알아 두면 여행을 갔을 때 도움이 된다. 그중의 하나가 팁 문화인데 팁은 서비스를 받은 후에 감사한 마음을 돈으로 표현하는 것이다. 꼭 팁을 주어야 하는 것은 아니지만 하나의 매너이기 때문에 너무 많거나 적지 않은 정도로 팁을 주는 사람이 많다. 유럽의 경우에는 보통 비용의 5~10%를 팁으로 준다. 미국에서는 비용의 10~15% 정도 팁을 주는 것이 일반적이다. 한국은 따로 팁을 주는 문화는 없지만 고마운 마음을 표현하고 싶을 때 가볍게 인사를 한다. 감사하다는 말을 하면서 인사를 하기 때문에 진심이 잘 전해진다.\n\n5. 글의 제목으로 가장 알맞은 것을 고르십시오.","choices": ["팁 문화의 장점과 단점","해외여행의 주의할 점","돈으로 표시하는 마음","각국의 다른 감사 표현"],"answer": 3},{"level": "","q": "나라마다 문화가 다르기 때문에 그 나라의 문화를 미리 알아 두면 여행을 갔을 때 도움이 된다. 그중의 하나가 팁 문화인데 팁은 서비스를 받은 후에 감사한 마음을 돈으로 표현하는 것이다. 꼭 팁을 주어야 하는 것은 아니지만 하나의 매너이기 때문에 너무 많거나 적지 않은 정도로 팁을 주는 사람이 많다. 유럽의 경우에는 보통 비용의 5~10%를 팁으로 준다. 미국에서는 비용의 10~15% 정도 팁을 주는 것이 일반적이다. 한국은 따로 팁을 주는 문화는 없지만 고마운 마음을 표현하고 싶을 때 가볍게 인사를 한다. 감사하다는 말을 하면서 인사를 하기 때문에 진심이 잘 전해진다.\n\n6. 글의 내용과 같은 것을 고르십시오.","choices": ["동양이건 서양이건 감사의 팁 문화가 있다.","팁은 많으면 많을수록 감사가 잘 표현된다.","한국에서는 인사를 하면서 고마움을 전한다.","서비스를 받은 후에는 반드시 팁을 줘야 한다."],"answer": 2}],"4": [{"level": "하","q": "직장인들의 회식 문화가 변하고 있다. 과거에는 회식을 하면 3차까지 이어지는 술자리가 당연했다. 그런데 최근에는 다양한 형식의 회식 문화가 생겨나고 있다. 설문 조사 결과에 따르면 회사의 회식 시간과 횟수가 십여 년 전에 비해 확실히 줄어든 것으로 보인다. 또한 공연 관람, 운동처럼 다른 형태의 회식이 증가했다고 답한 회사원이 많았다. 회식 시간은 점심 회식을 가장 선호하는 것으로 나타났으며 회식 문화 변화에 대해서 대부분이 긍정적이라고 답했다. 그동안 회식이 직장인들의 주요 스트레스 요인으로 꼽혔던 것과 달리, 신세대의 회식 문화는 현대 직장인에게 새로운 활력소가 되고 있다.\n\n\n1. 글의 중심 내용으로 가장 알맞은 것을 고르십시오.","choices": ["회식이 직장인들의 가장 큰 스트레스 원인이다.","회식의 시간과 유형이 직장인에게 영향을 준다.","회사의 회식 문화가 긍정적인 방향으로 변하고 있다.","신세대는 다양한 형태의 회식 문화를 골고루 즐긴다."],"answer": 2},{"level": "","q": "직장인들의 회식 문화가 변하고 있다. 과거에는 회식을 하면 3차까지 이어지는 술자리가 당연했다. 그런데 최근에는 다양한 형식의 회식 문화가 생겨나고 있다. 설문 조사 결과에 따르면 회사의 회식 시간과 횟수가 십여 년 전에 비해 확실히 줄어든 것으로 보인다. 또한 공연 관람, 운동처럼 다른 형태의 회식이 증가했다고 답한 회사원이 많았다. 회식 시간은 점심 회식을 가장 선호하는 것으로 나타났으며 회식 문화 변화에 대해서 대부분이 긍정적이라고 답했다. 그동안 회식이 직장인들의 주요 스트레스 요인으로 꼽혔던 것과 달리, 신세대의 회식 문화는 현대 직장인에게 새로운 활력소가 되고 있다.\n\n2. 글의 내용과 같은 것을 고르십시오.","choices": ["퇴근 후 회식 자리를 선호하는 직장인이 늘고 있다.","직장의 회식 시간은 길어지는 방향으로 변화해 왔다.","과거 직장인은 회식 자리에서 스트레스를 풀곤 했다.","달라진 회식 문화가 직장 생활에 활기를 더하고 있다."],"answer": 3},{"level": "중","q": "이번 콘서트는 이전보다 더 많은 노래를 들을 수 있어서 좋았다. 발라드뿐만 아니라 댄스 곡까지 들을 수 있었기 때문에 한 가수의 콘서트가 아니라 여러 가수가 함께하는 콘서트 같은 느낌을 주었다. 하지만 의자가 너무 작고 옆 사람과 가깝게 붙어 있어서 콘서트가 진행되는 내내 일어서서 노래를 따라 부르기가 불편했다. 그리고 콘서트가 끝나자마자 나가려고 하는 사람들이 많았는데 출입문이 많지 않아서 문 근처가 아주 복잡했다. 혹시 안전사고라도 나지 않을까 걱정이 됐다. 좌석과 출구 문제만 아니면 이번 콘서트는 아주 만족스러운 콘서트였을 것이다. 앞으로는 콘서트를 준비하는 회사가 팬들의 안전을 위해서라도 이런 부분을 생각해 줬으면 좋겠다. \n\n3. 글의 내용과 다른 것을 고르십시오.","choices": ["좌석 때문에 더 즐겁게 콘서트를 즐기기가 힘들었다.","이 사람은 콘서트에 나온 여러 가수의 공연을 즐겼다.","이전보다 더 다양한 노래를 들을 수 있는 콘서트였다.","콘서트가 끝나고 나갈 때 문 근처가 복잡해서 불편했다."],"answer": 1},{"level": "","q": "이번 콘서트는 이전보다 더 많은 노래를 들을 수 있어서 좋았다. 발라드뿐만 아니라 댄스 곡까지 들을 수 있었기 때문에 한 가수의 콘서트가 아니라 여러 가수가 함께하는 콘서트 같은 느낌을 주었다. 하지만 의자가 너무 작고 옆 사람과 가깝게 붙어 있어서 콘서트가 진행되는 내내 일어서서 노래를 따라 부르기가 불편했다. 그리고 콘서트가 끝나자마자 나가려고 하는 사람들이 많았는데 출입문이 많지 않아서 문 근처가 아주 복잡했다. 혹시 안전사고라도 나지 않을까 걱정이 됐다. 좌석과 출구 문제만 아니면 이번 콘서트는 아주 만족스러운 콘서트였을 것이다. 앞으로는 콘서트를 준비하는 회사가 팬들의 안전을 위해서라도 이런 부분을 생각해 줬으면 좋겠다. \n\n\n4. 글을 읽은 후 사람들의 반응으로 적당하지 않은 것을 고르십시오.","choices": ["이번 콘서트에 더 많은 출연자가 나왔으면 좋았을 텐데.","팬들의 안전을 생각하지 않은 것이 가장 큰 문제라고 봐.","출입문에 사람이 많이 몰려서 큰 사고가 날 수도 있었겠어.","좀 더 넓은 공간에서 한다면 다음 콘서트는 더 만족스럽겠어."],"answer": 0},{"level": "상","q": "층간 소음으로 인해 정신적 피해를 입었다는 사람들이 늘고 있다. 이 문제를 해결하려고 이웃집에 찾아가 이야기를 하다가 자주 다툼이 일어나기도 한다. 심한 경우에는 폭력 사건으로 이어지기도 해서 층간 소음은 사회적인 문제가 되고 있다. 그런데 층간 소음의 피해자들 중에는 망치로 천장을 두드린다든가 천장에 스피커를 설치한다든가 하면서 불만을 표현하는 사람들도 있다. 하지만 이러한 행위는 형사 처벌을 받을 수 있으므로 주의해야 한다. 일단 층간 소음 문제가 발생하게 되었을 경우에는 관리 사무소나 층간 소음 관리위원회 등과 같은 기관에 도움을 요청하는 것이 좋다. 직접 이웃과 대화를 나누다가 보면 서로의 감정을 상하게 하여 더 큰 갈등을 불러올 수 있기 때문이다.\n\n\n5. 글쓴이의 주장으로 가장 적당한 것을 고르십시오.","choices": ["층간 소음 문제를 발생시키는 경우 처벌을 해야 한다.","층간 소음 문제는 이웃과의 대화를 통해 해결해야 한다.","층간 소음으로 인한 보복 문제가 생기지 않게 해야 한다.","층간 소음 문제는 전문 기관을 통해 해결하는 것이 좋다."],"answer": 3},{"level": "","q": "층간 소음으로 인해 정신적 피해를 입었다는 사람들이 늘고 있다. 이 문제를 해결하려고 이웃집에 찾아가 이야기를 하다가 자주 다툼이 일어나기도 한다. 심한 경우에는 폭력 사건으로 이어지기도 해서 층간 소음은 사회적인 문제가 되고 있다. 그런데 층간 소음의 피해자들 중에는 망치로 천장을 두드린다든가 천장에 스피커를 설치한다든가 하면서 불만을 표현하는 사람들도 있다. 하지만 이러한 행위는 형사 처벌을 받을 수 있으므로 주의해야 한다. 일단 층간 소음 문제가 발생하게 되었을 경우에는 관리 사무소나 층간 소음 관리위원회 등과 같은 기관에 도움을 요청하는 것이 좋다. 직접 이웃과 대화를 나누다가 보면 서로의 감정을 상하게 하여 더 큰 갈등을 불러올 수 있기 때문이다.\n\n6. 글의 내용과 다른 것을 고르십시오.","choices": ["작은 층간 소음이라도 이웃에 끼치는 피해는 신체적으로 엄청나다.","층간 소음으로 인한 이웃 간 갈등이 사회적 문제로 확대되곤 한다.","층간 소음 관리위원회가 없다면 관리실이 그 역할을 대신할 수 있다.","층간 소음 피해자들이 오히려 처벌을 받게 되는 경우가 생길 수 있다."],"answer": 0}],"5": [{"level": "하","q": "최근 금으로 하는 재테크에 대한 관심이 높아지고 있다. 한 신문사의 조사 결과에 따르면 금시장의 하루 평균 거래액이 지난해 같은 기간보다 134.6% 늘었다. 투자자의 연령을 살펴보면 30대가 36.8%, 40대가 30.7%, 20대가 16.4%인 반면 50대는 12.6%, 60대 이상은 3.5%였다. 주식 시장에 익숙한 젊은 층들이 적극적으로 금에 투자한 것으로 보인다. 그런데 금에 투자할 때는 주의할 점이 있다. 바로 가격 변동성이다. 조사한 자료를 분석해 보면 2013년에는 한 해에만 금값이 29% 하락했다. 2011년 1월부터 2015년 12월까지의 기간 동안 43%가 하락하기도 했다. 달걀을 한 바구니에 담지 말라는 말이 있다. 금 투자는 위험성이 큰 만큼 분산 투자의 필요성을 늘 고려해야 한다.\n\n1. 글의 중심 내용을 고르십시오.","choices": ["금에만 많은 돈을 투자하는 것은 바람직하지 않다.","남녀노소 모두 투자에 적극적으로 나설 필요가 있다.","모든 연령층에게 투자 교육의 기회를 제공해야 한다.","금은 가격 변동이 크므로 투자는 전문사에 맡겨야 한다."],"answer": 0},{"level": "","q": "최근 금으로 하는 재테크에 대한 관심이 높아지고 있다. 한 신문사의 조사 결과에 따르면 금시장의 하루 평균 거래액이 지난해 같은 기간보다 134.6% 늘었다. 투자자의 연령을 살펴보면 30대가 36.8%, 40대가 30.7%, 20대가 16.4%인 반면 50대는 12.6%, 60대 이상은 3.5%였다. 주식 시장에 익숙한 젊은 층들이 적극적으로 금에 투자한 것으로 보인다. 그런데 금에 투자할 때는 주의할 점이 있다. 바로 가격 변동성이다. 조사한 자료를 분석해 보면 2013년에는 한 해에만 금값이 29% 하락했다. 2011년 1월부터 2015년 12월까지의 기간 동안 43%가 하락하기도 했다. 달걀을 한 바구니에 담지 말라는 말이 있다. 금 투자는 위험성이 큰 만큼 분산 투자의 필요성을 늘 고려해야 한다.\n\n\n2. 글의 내용과 같은 것을 고르십시오.","choices": ["올해 금 거래액이 작년에 비해서 크게 감소했다.","노년층보다 젊은 층의 금 재테크 투자 비율이 높다.","2011년부터 2015년까지는 금값이 떨어지지 않았다.","일부 금 투자자들은 주식 투자로 관심을 돌리고 있다."],"answer": 1},{"level": "중","q": "배달 음식 시장의 규모가 커지면서 이로 인해 배출되는 막대한 양의 일회용품 쓰레기 처리 문제가 심각해졌다. 특히 사용된 플라스틱 용기가 무분별하게 재활용 쓰레기로 버려져 쓰레기 수거 업체와 주민 간의 갈등이 격화되고 있다. 음식물이 묻어 있어 재활용이 불가능한 플라스틱 용기들이 수거되지 못한 채 방치되면서 주민 생활에 막대한 불편을 끼쳤기 때문이다. 문제의 심각성을 인식한 배달 음식 업체에서는 다양한 해결 방안을 실험 중이다. 음식 주문 시 고객에게 일회용 젓가락이나 플라스틱 포크 등의 사용 여부를 묻는 것 등이 그 예이다. 하지만 이러한 시도는 근본적인 해결책이 되기 어렵다. 늘어나는 플라스틱 용기를 대체할 새로운 재생 자원에 눈을 돌려야 하는 이유가 여기에 있다. 아직 시작 단계인 친환경 용기 개발 산업에 국가 차원의 지원이 절실하다.\n\n3.  글쓴이의 주장으로 가장 적당한 것을 고르십시오.","choices": ["급증하는 쓰레기를 줄이기 위해 배달 음식 시장의 규모를 줄여야 한다.","지역 주민과 쓰레기 수거 업체 사이의 갈등을 해소할 방안이 필요하다.","배달 음식 업체가 고객에게 제공하는 일회용품 사용을 금지해야 한다.","정부 주도로 재활용 쓰레기 문제를 해결할 근본적 대책을 세워야 한다."],"answer": 3},{"level": "","q": "배달 음식 시장의 규모가 커지면서 이로 인해 배출되는 막대한 양의 일회용품 쓰레기 처리 문제가 심각해졌다. 특히 사용된 플라스틱 용기가 무분별하게 재활용 쓰레기로 버려져 쓰레기 수거 업체와 주민 간의 갈등이 격화되고 있다. 음식물이 묻어 있어 재활용이 불가능한 플라스틱 용기들이 수거되지 못한 채 방치되면서 주민 생활에 막대한 불편을 끼쳤기 때문이다. 문제의 심각성을 인식한 배달 음식 업체에서는 다양한 해결 방안을 실험 중이다. 음식 주문 시 고객에게 일회용 젓가락이나 플라스틱 포크 등의 사용 여부를 묻는 것 등이 그 예이다. 하지만 이러한 시도는 근본적인 해결책이 되기 어렵다. 늘어나는 플라스틱 용기를 대체할 새로운 재생 자원에 눈을 돌려야 하는 이유가 여기에 있다. 아직 시작 단계인 친환경 용기 개발 산업에 국가 차원의 지원이 절실하다.\n\n4. 글의 내용과 같은 것을 고르십시오.","choices": ["정부는 쓰레기 문제를 해결하려고 갖가지 방법을 실험 중이다.","근본적인 원인은 음식물 쓰레기가 분리 배출되지 않는 데 있다.","쓰레기 관리 업체는 오염된 재활용 쓰레기를 수거하지 않는다.","음식점은 주문 배달 방법을 개선하여 문제의 원인을 제거하였다."],"answer": 2},{"level": "상","q": "이태영 선생은 한국 최초의 여성 변호사이자 서울대 최초의 여자 법대생이며, 사법고시에 합격한 최초의 여성이다. 이 선생은 어려서부터 남녀 차별 없이 자녀를 평등하게 교육시킨 홀어머니의 영향을 받으며 자랐다. 후에 독립운동가이며 정치가인 남편의 지지로 32세라는 늦은 나이에 서울대 법대에 입학했다. 4형제를 키우며 전쟁 중에도 책을 놓지 않은 그녀는 38세에 사법고시에 합격했다. 하지만 정치가의 아내이고 여성이라는 이유로 판사 임용 과정에서 탈락되었다. 이 선생은 변호사가 되어 사회적 약자였던 여성의 목소리를 대변하는 길을 가게 된다. 이 선생은 1956년 여성법률상담소를 설립하여 법의 보호를 받지 못해 고통받는 많은 여성들을 상담해 주었다. 또한 여성에게 불리했던 가족법을 개선하는 데 힘쓰는 등 한국 여성의 지위 향상을 위해 평생을 바쳤다.\n\n5. 글의 내용과 다른 것을 고르십시오.","choices": ["이 선생은 당대 가족 제도가 여성에게 차별적이라고 여겼다.","이 선생은 판사 임용을 거절하고 변호사가 되기로 결심했다.","이 선생의 남편은 이 선생이 법대에 입학하는 것에 찬성했다.","이 선생은 많은 여성들이 법적인 보호를 받을 수 있게 도왔다."],"answer": 1},{"level": "","q": "이태영 선생은 한국 최초의 여성 변호사이자 서울대 최초의 여자 법대생이며, 사법고시에 합격한 최초의 여성이다. 이 선생은 어려서부터 남녀 차별 없이 자녀를 평등하게 교육시킨 홀어머니의 영향을 받으며 자랐다. 후에 독립운동가이며 정치가인 남편의 지지로 32세라는 늦은 나이에 서울대 법대에 입학했다. 4형제를 키우며 전쟁 중에도 책을 놓지 않은 그녀는 38세에 사법고시에 합격했다. 하지만 정치가의 아내이고 여성이라는 이유로 판사 임용 과정에서 탈락되었다. 이 선생은 변호사가 되어 사회적 약자였던 여성의 목소리를 대변하는 길을 가게 된다. 이 선생은 1956년 여성법률상담소를 설립하여 법의 보호를 받지 못해 고통 받는 많은 여성들을 상담해 주었다. 또한 여성에게 불리했던 가족법을 개선하는 데 힘쓰는 등 한국 여성의 지위 향상을 위해 평생을 바쳤다.\n\n6. 글을 읽은 후 사람들의 반응으로 적당하지 않은 것을 고르십시오.","choices": ["이 선생님처럼 대학을 졸업해야 사회에서 차별받지 않는다고 생각해.","시대를 앞선 어머니의 교육관이 선생님에게 큰 영향을 미쳤던 것 같아.","이 선생님 같은 분이 계셔서 한국 사회의 여성 권익이 향상됐다고 봐.","어려운 상황에도 자신이 하고자 하는 일을 포기하지 않았다는 게 대단해."],"answer": 0}],"6": [{"level": "하","q": "누구나 숭고한 사랑이라고 하면 단연 ‘모성애’를 꼽을 것이다. 가장 희생적이고 헌신적인 사랑이니까 말이다. 그런데 이 영화에서는 도덕성을 상실한 ‘모성애’를 보여 준다. 영화 속 주인공인 ‘어머니’는 어느 날 끔찍이 아끼고 사랑하는 아들이 갑자기 경찰에게 끌려가는 것을 보게 된다. 아들의 무죄를 끝까지 믿고 있던 어머니는 결국 아들이 진짜 범인이라는 것을 알게 되고 아들의 범행을 목격한 증인을 없애고자 살인을 저지르고 만다. 이 영화는 자기 자식을 위해서라면 양심도 버릴 수 있고 타인도 희생시킬 수 있다고 생각하는 극단적인 ‘모성애’가 얼마나 파괴적인지를 그려냈다. 인류가 지향하는 보편적 가치를 상실했다면 모성애라 하더라도 아름답고 숭고하게만 볼 수는 없다는 해석이 엿보인다. 이 영화는 진정한 모성애가 무엇인지를 오래 생각하게 만든다. \n\n\n1. 글을 쓴 의도로 알맞은 것을 고르십시오.","choices": ["목격자 증언이나 증거 확보가 어려움을 설명하려고","극단적이고 이기적인 모성애의 위험성을 경고하려고","보편적 가치를 상실한 사회의 비도덕성을 고발하려고","어머니야말로 가장 숭고한 사랑의 원천임을 강조하려고"],"answer": 1},{"level": "","q": "누구나 숭고한 사랑이라고 하면 단연 ‘모성애’를 꼽을 것이다. 가장 희생적이고 헌신적인 사랑이니까 말이다. 그런데 이 영화에서는 도덕성을 상실한 ‘모성애’를 보여 준다. 영화 속 주인공인 ‘어머니’는 어느 날 끔찍이 아끼고 사랑하는 아들이 갑자기 경찰에게 끌려가는 것을 보게 된다. 아들의 무죄를 끝까지 믿고 있던 어머니는 결국 아들이 진짜 범인이라는 것을 알게 되고 아들의 범행을 목격한 증인을 없애고자 살인을 저지르고 만다. 이 영화는 자기 자식을 위해서라면 양심도 버릴 수 있고 타인도 희생시킬 수 있다고 생각하는 극단적인 ‘모성애’가 얼마나 파괴적인지를 그려냈다. 인류가 지향하는 보편적 가치를 상실했다면 모성애라 하더라도 아름답고 숭고하게만 볼 수는 없다는 해석이 엿보인다. 이 영화는 진정한 모성애가 무엇인지를 오래 생각하게 만든다. \n\n2. 글의 내용과 같은 것을 고르십시오.","choices": ["어머니는 아들을 범인으로 오해했다.","아들은 억울하게 경찰서에 끌려갔다.","어머니는 아들을 위해서 죄를 짓는다.","아들은 살인 사건의 목격자를 죽였다."],"answer": 2},{"level": "중","q": "지난달부터 어린이 보호 구역의 교통사고 발생을 방지하기 위한 법이 새로 시행되었다. 작년 9월 교통사고로 사망한 9세 김민식 군의 사고 이후 발의되어 민식이법으로 불리기도 한다. 어린이 보호 구역은 어린이를 교통사고의 위험에서 보호하기 위해 필요하다고 판단된 경우에 지정된다. 어린이 보호 구역에는 어린이 보호 안내 표지판과 신호등의 설치가 의무화되고 과속 단속 카메라 등도 추가로 설치되어 각종 위반 행위를 단속하게 된다. 새로운 법에 따르면 이 구역 안에서 운전자들은 통행 속도를 시속 30km 이내로 운행해야 하며 횡단보도 앞에서는 반드시 멈춰야 한다. 이 같은 안전 의무를 위반하여 사고를 일으킨 가해자는 가중 처벌을 받게 된다. 운전자의 부주의로 인해 어린이 보호 구역에서 어린이가 사망할 경우 무기징역 또는 3년 이상의 징역형을 받게 된다.\n\n\n3. 글의 내용과  다른 것을 고르십시오.","choices": ["한 아이의 사망 사고를 계기로 기존의 일반 교통안전법을 강화했다.","어린이 보호 구역 횡단보도 앞에서 모든 차량들은 일단 멈춰야 한다.","어린이 보호 구역에는 의무적으로 과속 차량을 적발할 장비를 설치한다.","어린이 교통사고가 난 경우 안전 의무를 위반했으면 가중 처벌을 받는다."],"answer": 0},{"level": "","q": "지난달부터 어린이 보호 구역의 교통사고 발생을 방지하기 위한 법이 새로 시행되었다. 작년 9월 교통사고로 사망한 9세 김민식 군의 사고 이후 발의되어 민식이법으로 불리기도 한다. 어린이 보호 구역은 어린이를 교통사고의 위험에서 보호하기 위해 필요하다고 판단된 경우에 지정된다. 어린이 보호 구역에는 어린이 보호 안내 표지판과 신호등의 설치가 의무화되고 과속 단속 카메라 등도 추가로 설치되어 각종 위반 행위를 단속하게 된다. 새로운 법에 따르면 이 구역 안에서 운전자들은 통행 속도를 시속 30km 이내로 운행해야 하며 횡단보도 앞에서는 반드시 멈춰야 한다. 이 같은 안전 의무를 위반하여 사고를 일으킨 가해자는 가중 처벌을 받게 된다. 운전자의 부주의로 인해 어린이 보호 구역에서 어린이가 사망할 경우 무기징역 또는 3년 이상의 징역형을 받게 된다.\n\n4. 글을 읽은 후 사람들의 반응으로 적당하지 않은 것을 고르십시오.","choices": ["이제는 어린아이들이 좀 안심하고 등교나 하교를 할 수 있겠네.","이런 좋은 법을 발의해 놓고 시행을 미루는 이유를 알 수 없군.","앞으로 어린이 보호 구역을 운전할 때는 반드시 서행해야겠네.","이 법이 더 일찍 만들어졌던들 민식이가 희생되지는 않았을 텐데."],"answer": 1},{"level": "상","q": "최근 신입 사원 채용 면접에서 인공 지능을 활용하는 기업들이 늘고 있다. 그 이유는 사람이 하는 평가보다 공정하고 효율적이라고 보기 때문이다. 인공 지능이 지원자의 자기소개서를 분석하고 면접을 본 후 조직과 직무에 적합한지를 평가한다. 주어진 데이터에 따라 기계적으로 평가하는 만큼 특정 지원자에게 특혜를 주는 채용 비리를 방지할 수 있다는 게 이점이다. 또한 사람이 직접 평가할 때와 달리 면접 장소와 시간도 자유롭게 선택할 수 있고 비용도 절감된다. 그러나 문제점도 있다. 인공 지능은 아직 사람을 뽑거나 떨어뜨리는 것을 결정할 만큼 기술력이 완벽한 수준에 도달하지 못했다. 평가 기준이 되는 데이터는 기존 평가관들의 판단 결과를 바탕으로 한 것이어서 완전히 객관적이라고 하기 어렵다. 또한 인공 지능은 인간에게서 느껴지는 분위기나 매력 같은 것을 감지할 수 없다. 그래서 인성을 평가하거나 미래 사회가 요구하는 창의적인 인재를 구별하기 어렵다는 문제도 인공 지능 사용이 조심스러운 이유 중의 하나이다.\n\n5. 글을 쓴 목적으로 알맞은 것을 고르십시오.","choices": ["인공 지능 면접의 취지를 설명하기 위해서","인공 지능 면접의 기준을 제시하기 위해서","인공 지능 면접의 효율을 강조하기 위해서","인공 지능 면접의 한계를 지적하기 위해서"],"answer": 3},{"level": "","q": "최근 신입 사원 채용 면접에서 인공 지능을 활용하는 기업들이 늘고 있다. 그 이유는 사람이 하는 평가보다 공정하고 효율적이라고 보기 때문이다. 인 function fillExam(stu, correctCounts, speakResp, writeResp){

function rubricMax(area){ return RUBRIC[area].length*3; }
function sumArr(a){ return (a||[]).reduce((x,y)=>x+y,0); }
function computeAI(stu){
  const sSec=(stu.responses.speaking.sec||0), wLen=(stu.responses.writing.text||'').length;
  const sb=Math.max(0,Math.min(3, 1+Math.floor(sSec/22)));
  const wb=Math.max(0,Math.min(3, 1+Math.floor(wLen/140)));
  // 구인별로 기준선(sb/wb) 대비 ±1 변주를 주어 현실적인 가채점 분포 생성
  const vary=(base,i)=>Math.max(0,Math.min(3, base + (i%3===0?0:(i%3===1?-1:1)) ));
  stu.ai={
    speaking:{scores:RUBRIC.speaking.map((c,i)=>vary(sb,i))},
    writing:{scores:RUBRIC.writing.map((c,i)=>vary(wb,i))},
  };
}
function gradeHumanFor(stu){
  if(!stu.ai) computeAI(stu);
  stu.human.speaking={scores:stu.ai.speaking.scores.map((v,i)=>Math.min(3,v+(i===0?1:0))), confirmed:true};
  stu.human.writing ={scores:stu.ai.writing.scores.map((v,i)=>Math.min(3,v+(i===0?1:0))), confirmed:true};
}
function humanArea20(stu,area){
  const h=stu.human[area]; if(!h||!h.confirmed) return null;
  return Math.round(sumArr(h.scores)/rubricMax(area)*DB.settings.weights[area]);
}
function totalScore(stu){
  if(!stu.auto) return null;
  const sp=humanArea20(stu,'speaking'), wr=humanArea20(stu,'writing');
  if(sp==null||wr==null) return null;
  const parts=[stu.auto.vocab.score,stu.auto.listening.score,stu.auto.reading.score,sp,wr];
  if(DB.settings.rule==='min'){
    const total=DB.settings.weights, maxEach=Math.max(...AREAS.map(a=>total[a]));
    const norm=parts.map((p,i)=>p/[total.vocab,total.listening,total.reading,total.speaking,total.writing][i]);
    return Math.round(Math.min(...norm)*100);
  }
  return parts.reduce((x,y)=>x+y,0);
}
function gradeFromTotal(total){
  if(total==null) return null;
  const cl=DB.settings.cutlines;
  for(let i=GRADES.length-1;i>=0;i--){ const g=GRADES[i]; if(total>=cl[g]) return g; }
  return 1;
}
/* ---------------------------------------------------------
   종합 급수 산정 (온라인 글로벌 한국어 과정 8급 체계):
   - 5개 영역 종합 점수(0~100) → 커트라인 → 1~8급
   - 각 급을 성취 수준에 따라 상/중/하로 판정 (공식: 상 80%↑ · 중 60~80% · 하 20~60%)
   - 어휘·문법 결과는 이후 영역의 '적응형 출제 수준'(자기 등급 ±1)을 결정
   --------------------------------------------------------- */
const SUBLEVELS={1:['하','중','상'],2:['하','중','상'],3:['하','중','상'],4:['하','중','상'],5:['하','중','상'],6:['하','중','상'],7:['하','중','상'],8:['하','중','상']};
function subOf100(t){
  const g=gradeFromTotal(t); if(g==null) return null;
  const cl=DB.settings.cutlines; const lo=cl[g], hi=(g<8?cl[g+1]:101);
  const span=Math.max(1,hi-lo); const frac=Math.max(0,Math.min(0.999,(t-lo)/span));
  // 공식 기준: 상 80%↑ · 중 60~80% · 하 <60%
  return frac>=0.8?'상': frac>=0.6?'중':'하';
}
function gradeInfo(t){ const g=gradeFromTotal(t); if(g==null) return null; const sub=subOf100(t); return {g,sub,label:g+'급 '+sub}; }
function placement(stu){ const t=totalScore(stu); return t==null?null:gradeInfo(t); }   // 5영역 종합 기반
function gradeChipStu(stu,small){
  const p=placement(stu); if(!p) return '<span class="pill warn no">대기</span>';
  return `<span style="display:inline-flex;align-items:center;gap:5px"><span class="grade-badge ${small?'sm':''}">${p.g}급</span><b class="small" style="color:var(--admin)">${p.sub}</b></span>`;
}
function areaGradeLabel(stu,area){
  const sc=areaScore20(stu,area); if(sc==null) return null;
  const gi=gradeInfo(Math.round(sc/DB.settings.weights[area]*100)); return gi?gi.label:null;
}
/* 권장 반 = 평가 급수보다 한 단계 위 (그 수준까지는 이미 이해하므로 다음 단계를 학습)
   같은 급수 내 다음 세부단계 → 최상위면 위 급수 하 → 8급 상은 유지 */
function nextClassLevel(g,sub){
  const arr=SUBLEVELS[g]; const i=arr.indexOf(sub);
  if(i>=0 && i<arr.length-1) return {g, sub:arr[i+1]};
  if(g<8) return {g:g+1, sub:SUBLEVELS[g+1][0]};
  return {g, sub};
}
function classFor(stu){ const p=placement(stu); if(!p) return null; const n=nextClassLevel(p.g,p.sub); return {g:n.g, sub:n.sub, label:n.g+'급 '+n.sub}; }
function assignClass(stu){
  const c=classFor(stu); stu.assignedGrade=c?c.g:null; stu.assignedSub=c?c.sub:null;
  stu.assignedClass = c? (c.label+'반') : null;
}
function areaScore20(stu,area){
  if(area==='speaking'||area==='writing') return humanArea20(stu,area);
  return stu.auto? stu.auto[area].score : null;
}

function renderStudent(){
  const s=session; const me=s.me?getStudent(s.me):null;
  let html='';
  if(s.step==='auth'||!me) html=stuAuth();
  else if(s.step==='home') html=stuHome(me);
  else if(s.step==='intro') html=stuIntro();
  else if(s.step==='vocab'||s.step==='listening'||s.step==='reading') html=stuExam(s.step);
  else if(s.step==='speaking') html=stuSpeaking();
  else if(s.step==='writing') html=stuWriting();
  else if(s.step==='submitted') html=stuSubmitted(me);
  else if(s.step==='result'){ html=stuResult(me); }
  app().innerHTML=phone(html);
  if(s.step==='result') drawRadarIfAny();
}

const STEP_ORDER=['vocab','listening','reading','writing','speaking'];
function stepLabel(step){
  const idx=STEP_ORDER.indexOf(step);
  return STEP_ORDER.map((a,i)=>`<div class="st ${i<idx?'done':i===idx?'on':''}">${AREA_KO[a].replace('·','')}</div>`).join('');
}
function stuExam(area){
  const qs=examItemsFor(area); const qi=session.qi; const q=qs[qi];
  const picked=session.draft[area][qi];
  let media='';
  if(area==='listening'){
    media=`<div class="player"><button class="play" onclick="playAudio(${qi})">▶</button>
      <div class="wave">${[40,70,100,55,80,35,90,60,45,75].map(h=>'<i style="height:'+h+'%"></i>').join('')}</div><span class="small mono muted">🔊 2회 듣기</span></div>
      <div class="passage" id="audioText_${qi}" style="display:none"><b class="small" style="color:var(--system)">🔊 음성 내용(대본)</b><br>${(q.audio||'').replace(/\n/g,'<br>')}</div>`;
  }
  if(area==='reading' && q.passage) media=`<div class="passage">${q.passage}</div>`;
  const choices=q.c.map((c,i)=>`<button class="choice ${picked===i?'sel':''}" onclick="pick('${area}',${qi},${i})"><span class="k">${i+1}</span> ${c}</button>`).join('');
  // 어휘·문법 CAT: 난이도(하/중/상) + 적응형 상태
  const vocabDiff = qi<4?'하':qi<7?'중':'상';
  let lv = q.level?`<span class="pill system no" style="font-size:10.5px">난이도 ${q.level}</span>`:'';
  let catBar='';
  if(area==='vocab'){
    lv=`<span class="pill system no" style="font-size:10.5px">난이도 ${vocabDiff}</span>`;
    const done=session.draft.vocab.filter(x=>x!=null).length;
    let corr=0; qs.forEach((qq,i)=>{ if(session.draft.vocab[i]===qq.a) corr++; });
    const est=gradeFromTotal(done?Math.round(corr/done*100):50)||'-';
    catBar=`<div class="info-banner" style="margin-top:8px;padding:8px 11px">🧠 <b>CAT 적응형</b> · 응답에 따라 난이도가 조정됩니다. 현재 추정 등급 <b>${est}급</b> · 능력이 파악되면 조기 종료`;
    catBar+= (qi>=5)?` <button class="btn ghost sm" style="margin-left:6px" onclick="endVocabEarly()">능력 파악됨 · 어휘 종료 →</button>`:'';
    catBar+='</div>';
  }
  return `<div class="row-between"><span class="qtag">${AREA_KO[area]}</span><span class="timer-chip mono">⏱ ${examTimer()}</span></div>
  <div class="steps">${stepLabel(area)}</div>
  <div class="progress"><i style="width:${Math.round((qi)/qs.length*100)}%"></i></div>
  <div class="row-between" style="margin-top:6px"><p class="small muted">문항 ${qi+1} / ${qs.length}</p>${lv}</div>
  ${catBar}
  ${media}
  <div class="qtext">${q.q}</div>
  <div class="choices">${choices}</div>
  <div class="row-between mt2">
    <button class="btn ghost sm" ${qi===0?'disabled':''} onclick="prevQ()">← 이전</button>
    <button class="btn ghost sm" onclick="toast('임시저장되었습니다 · 이어하기 가능')">임시저장</button>
    <button class="btn primary sm" ${picked==null?'disabled':''} onclick="nextQ('${area}')">${qi===qs.length-1?'다음 영역 →':'다음 문항 →'}</button>
  </div>`;
}

  };
  const t=totalScore(me); const p=placement(me);
  const head=`<div class="ai-card"><div class="ai-h">✦ 최종 결과</div>
      <div class="row-between"><span class="small muted">종합 급수 <span style="font-weight:400">(5영역 종합)</span></span>${gradeChipStu(me,false)}</div>
      <div class="row-between mt"><span class="small muted">5영역 종합 점수</span><span class="mono" style="font-weight:800">${t} / 100 → ${p.label}</span></div>
      <div class="row-between mt"><span class="small muted">배정 반 <span style="font-weight:400">(권장 · 한 단계 ↑)</span></span><span>${me.classConfirmed&&me.assignedClass?('<b>'+me.assignedClass+'</b>'):`<span class="pill admin no">배정 대기 (${classFor(me)?classFor(me).label+'반':'—'})</span>`}</span></div>
      <p class="small mt2" style="line-height:1.7">${aiFeedback(me)}</p></div>

      <div class="radar-legend"><span><i style="background:var(--admin)"></i> 내 성취도</span><span><i style="border-top:2px dashed var(--muted);height:0"></i> 응시자 평균</span></div>`;
  return `<h2 style="font-size:17px">내 결과</h2>
  <div class="mt">${head}</div>
  <p class="small muted mt2" style="font-weight:700">영역별 성취도</p>

  <button class="btn ghost block mt2" onclick="go('home')">← 홈으로</button>`;
}
function aiFeedback(me){
  const p=placement(me); const lbl=p?p.label:''; const c=classFor(me); const rec=c?c.label:'';
  const weak=AREAS.map(a=>({a,s:areaScore20(me,a)||0})).sort((x,y)=>x.s-y.s)[0];
  return `5개 영역 종합 <b>${totalScore(me)}/100</b>, 평가 결과는 <b>${lbl}</b> 수준입니다. <b>${lbl}</b>까지는 이미 이해하고 있으므로 한 단계 높은 <b style="color:var(--student)">${rec}반</b> 수업을 권장합니다. 상대적으로 <b style="color:var(--danger)">${AREA_KO[weak.a]}</b> 영역 보완이 필요해 보입니다.`;
}

function getStudent(id){ return DB.students.find(s=>s.id===id); }
function isFullyGraded(me){ return me.progress==='submitted' && me.human.speaking&&me.human.speaking.confirmed && me.human.writing&&me.human.writing.confirmed; }
function go(step){ session.step=step; render(); }
function doLogin(){
  const name=(document.getElementById('au_name').value||'').trim()||'응시자';
  const uname=(document.getElementById('au_id').value||'').trim();
  const birth=(document.getElementById('au_birth')?document.getElementById('au_birth').value:'').trim();
  // 로그인: 학번 + 생년월일 (연세대 한국어 앱 계정)
  if(!uname || !birth){ toast('학번과 생년월일을 모두 입력하세요'); return; }
  const key=uname;
  let me=DB.students.find(s=>s.username===key);
  if(!me){ me=newStudent('me_'+Object.keys(DB.students).length+'_'+key,name,key); me.joined=true; DB.students.push(me); }
  else { me.joined=true; me.name=name; }
  session.me=me.id; session.step='home'; toast('✓ 앱 로그인 완료 · [시험] 탭 진입'); render();
}
function examItemsFor(area){
  if(area==='listening'||area==='reading'){ if(session.examSel&&session.examSel[area]) return session.examSel[area]; }
  return QUESTIONS[area];
}
function buildExamSel(){
  // 고정형: 기본 실제 세트 / 적응형: 어휘 결과 등급의 실제 문항으로 교체 (조기종료 개념)
  if(DB.settings.mode==='adaptive'){
    const g=routedGrade();
    session.examSel={grade:g, listening:bankPick('listening',g,QUESTIONS.listening.length), reading:bankPick('reading',g,QUESTIONS.reading.length)};
  } else {
    session.examSel={grade:null, listening:QUESTIONS.listening, reading:QUESTIONS.reading};
  }
}
function startExam(){
  const me=getStudent(session.me);
  me.progress='in_progress';
  session.examSel=null;
  session.draft={vocab:new Array(QUESTIONS.vocab.length).fill(null),
                 listening:new Array(QUESTIONS.listening.length).fill(null),
                 reading:new Array(QUESTIONS.reading.length).fill(null),
                 speaking:{sec:0}, writing:{photo:false,text:''}};
  session.qi=0; session.examStart=Date.now(); go('vocab');
}
function pick(area,qi,i){ session.draft[area][qi]=i; render(); }
function nextQ(area){
  const qs=examItemsFor(area);
  if(session.qi<qs.length-1){ session.qi++; render(); }
  else {
    if(area==='vocab'){ buildExamSel(); if(DB.settings.mode==='adaptive'){ toast('적응형: 어휘·문법 결과 → '+routedGrade()+'급 수준 문항 출제'); } }
    const ni=STEP_ORDER.indexOf(area)+1; session.qi=0; go(STEP_ORDER[ni]);
  }
}
function prevQ(){ if(session.qi>0){session.qi--; render();} }
function playAudio(qi){ const el=document.getElementById('audioText_'+qi); if(el) el.style.display=el.style.display==='none'?'block':'none'; }
function toggleRec(){
  if(session.recording){
    clearInterval(session.recTimer); session.recording=false; session.draft.speaking.sec=session.recSec;
    render();
  } else {
    session.recording=true; session.recSec=0;
    session.recTimer=setInterval(()=>{ session.recSec++; const el=document.getElementById('recTime'); if(el) el.textContent=fmt(session.recSec); if(session.recSec>=90){toggleRec();} },1000);
    render();
  }
}
function submitExam(){
  if(session.recording) toggleRec();
  if(!(session.draft.speaking.sec>0)){ toast('먼저 말하기 녹음을 해주세요'); return; }
  openModal({ic:'📝',title:'정말 제출하시겠습니까?',body:'제출 후에는 답안을 수정할 수 없습니다. 말하기·쓰기는 채점 후 결과가 공개됩니다.',yes:'네, 제출합니다',onYes:()=>{
    const me=getStudent(session.me);
    me.answers={vocab:session.draft.vocab,listening:session.draft.listening,reading:session.draft.reading};
    me.examItems={vocab:QUESTIONS.vocab, listening:examItemsFor('listening'), reading:examItemsFor('reading')};
    me.responses={speaking:session.draft.speaking, writing:session.draft.writing};
    me.progress='submitted';
    computeAuto(me); computeAI(me);
    closeModal(); go('submitted'); toast('✓ 제출 완료 · 자동채점 반영됨');
  }});
}
function examTimer(){ if(!session.examStart) return '00:00'; return fmt(Math.floor((Date.now()-session.examStart)/1000)); }
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }

function setGradeTab(t){ session.gradeTab=t; renderStaff(); }
function confirmGrade(id){

function bigDiff(s){
  if(!isFullyGraded(s)) return false;

      || Math.abs(sumArr(s.ai.writing.scores)-sumArr(s.human.writing.scores))>=3;
}
function sbVerify(){

        <span class="hint">합산=5영역 배점 합계, 최저영역=가장 낮은 영역 기준</span></div>
    </div>
    <div class="card"><h3 style="font-size:14px">② 급수 커트라인 <span class="muted small">(종합 점수 0~100 최소값)</span></h3>
      <div class="tbl-wrap mt" style="box-shadow:none"><table style="min-width:auto"><thead><tr><th>급수</th><th>최소 종합점수</th></tr></thead><tbody>
      ${[8,7,6,5,4,3,2,1].map(g=>`<tr><td><span class="grade-badge sm">${g}급</span></td><td><input class="input" style="width:70px" type="number" value="${cl[g]}" onchange="setCut(${g},this.value)"></td></tr>`).join('')}
      </tbody></table></div>
      <div class="perm-note">세부 단계(상/중/하)는 각 급 구간 내 성취율로 자동 배정 — <b>상 80%↑ · 중 60~80% · 하 &lt;60%</b> (공식 기준).</div>
      <button class="btn primary block mt2" onclick="toast('✓ 설정 저장됨 · 분반 계산에 즉시 반영')">저장</button>
    </div>
  </div>
  <div class="card mt2"><h3 style="font-size:14px">③ 출제 방식 <span class="muted small">· 연대 확정 대기(TBD)</span></h3>
    <div class="seg-btns mt"><button class="${DB.settings.mode!=='adaptive'?'on':''}" onclick="setMode('fixed')">고정형 (전원 동일 문항)</button><button class="${DB.settings.mode==='adaptive'?'on':''}" onclick="setMode('adaptive')">적응형 (조기종료·등급별 출제)</button></div>
    <div class="perm-note">· <b>고정형</b>: 모든 응시자가 같은 문항 세트를 풀고 온라인화만. 문항 수 동일.<br>· <b>적응형</b>: 어휘·문법 결과 등급으로 듣기·읽기·말하기·쓰기 문항을 <b>자기 등급 수준</b>으로 선별 출제(문항 수 절감·CAT/MST). 학생 탭에서 두 방식이 실제로 다르게 동작합니다.</div>
  </div>
  <div class="card mt2"><h3 style="font-size:14px">참고: 적응형 출제 원리 <span class="muted small">· 온라인글로벌한국어능력시험(IBT/CBT)</span></h3>
    <p class="small muted mt" style="line-height:1.7">① 어휘·문법 <b>최대 60문항</b>을 먼저 응시 → 자동 채점으로 <b>등급(1급~8급, 상/중/하)</b> 판정.<br>② 그 등급 기준 <b>자기 등급 ±1 수준</b>의 듣기·읽기 문항이 각 6문항씩 제공되고, 쓰기·말하기도 등급에 맞는 과제가 자동 할당.<br>③ 객관식에서 <b>정답률 50%를 처음 못 넘긴 등급으로 확정</b>되고 다음 등급 문항엔 도전하지 않음.</p>
    <div class="grid-2 mt"><div>
      <div class="field"><label>어휘·문법 정답률(%) → 출제 수준</label><input class="input" type="number" min="0" max="100" id="simScore" value="72" oninput="simPlace()"></div>
      <div class="pcard" style="text-align:center;background:var(--admin-bg);border-color:#ddd0f5"><div class="small muted">판정 등급</div><div id="simOut" style="font-size:20px;font-weight:900;color:var(--admin);margin-top:4px">${(gradeInfo(72)||{}).label||'—'}</div></div>
    </div><div>
      <div class="perm-note" style="margin-top:0">문항 은행(과목당): 어휘 60 · 듣기 36 · 읽기 36 · 쓰기 6 · 말하기 6 = <b>총 144</b>. 실제 응시는 어휘 60 + 듣기·읽기 각 6 + 쓰기 1~2 + 말하기 3~4 (간편 진단 총 120분 이내).</div>
    </div></div>
  </div>`;
}
function simPlace(){ const el=document.getElementById('simScore'); if(!el) return; const gi=gradeInfo(Math.max(0,Math.min(100,+el.value))); const o=document.getElementById('simOut'); if(o)o.textContent=gi?gi.label:'—'; }
function setWeight(a,v){ DB.settings.weights[a]=parseInt(v)||0; DB.students.forEach(s=>{if(s.auto)computeAuto(s);}); renderStaff(); }
function setCut(g,v){ DB.settings.cutlines[g]=parseInt(v)||0; renderStaff(); }
function setRule(r){ DB.settings.rule=r; renderStaff(); }
function setMode(m){ DB.settings.mode=m; toast(m==='adaptive'?'적응형(조기종료)으로 전환 · 어휘 결과 등급의 문항 출제':'고정형으로 전환 · 전 응시자 동일 문항'); renderStaff(); }

/* =========================================================
   7) 공통 UI
   ========================================================= */
function seg(btn){ [...btn.parentElement.children].forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2200); }
function openModal(o){ document.getElementById('mIc').textContent=o.ic; document.getElementById('mTitle').textContent=o.title; document.getElementById('mBody').textContent=o.body; document.getElementById('mYes').textContent=o.yes; document.getElementById('mYes').onclick=o.onYes; document.getElementById('modal').classList.add('on'); }
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
function resetAll(){ openModal({ic:'↻',title:'처음부터 다시?',body:'모든 시뮬레이션 데이터가 초기화됩니다.',yes:'초기화',onYes:()=>{seed(); document.getElementById('roleTabs').children[0].click(); closeModal(); toast('초기 상태로 리셋됨');}}); }

document.getElementById('roleTabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...b.parentElement.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  session.role=b.dataset.role;
  document.getElementById('subRole').classList.toggle('hidden', session.role!=='staff');
  render();
});
document.getElementById('subRole').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...b.parentElement.children].forEach(x=>x.classList.remove('on','admin','instructor'));
  b.classList.add('on',b.dataset.sub); session.sub=b.dataset.sub; renderStaff(); updateHint();
});

document.addEventListener('input',e=>{ if(e.target.id==='wr_text'){ const c=document.getElementById('wr_count'); if(c)c.textContent=e.target.value.length; } });

function drawRadarIfAny(){
  const box=document.getElementById('radarBox'); if(!box) return;
  const me=getStudent(session.me); if(!me||!isFullyGraded(me)) return;
  const axes=['어휘문법','읽기','듣기','말하기','쓰기'];
  const order=['vocab','reading','listening','speaking','writing'];
  const me5=order.map(a=>{const v=areaScore20(me,a)||0; return v/DB.settings.weights[a];});
  const avg=[0.62,0.60,0.66,0.58,0.55];
  box.innerHTML=radarSVG(axes,me5,avg);
}
function radarSVG(axes,me,avg){
  const size=210,cx=size/2,cy=size/2,R=76;
  const pt=(i,r)=>{const ang=-Math.PI/2+i*2*Math.PI/5;return [cx+Math.cos(ang)*R*r,cy+Math.sin(ang)*R*r];};
  const poly=v=>v.map((x,i)=>pt(i,x).join(',')).join(' ');
  let grid='';[0.25,0.5,0.75,1].forEach(r=>grid+=`<polygon points="${poly([r,r,r,r,r])}" fill="none" stroke="#dde3ea"/>`);
  let sp='',lb='';for(let i=0;i<5;i++){const p=pt(i,1);sp+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#dde3ea"/>`;const l=pt(i,1.22);lb+=`<text x="${l[0]}" y="${l[1]}" font-size="10" fill="#697586" font-weight="700" text-anchor="middle" dominant-baseline="middle">${axes[i]}</text>`;}
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="overflow:visible">${grid}${sp}
    <polygon points="${poly(avg)}" fill="none" stroke="#697586" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="${poly(me)}" fill="rgba(106,75,208,.22)" stroke="#6a4bd0" stroke-width="2"/>
    ${me.map((v,i)=>{const p=pt(i,v);return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#6a4bd0"/>`}).join('')}${lb}</svg>`;
}

seed(); render();
</script>
