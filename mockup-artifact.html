<style>

.timer-chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700}
.rec-btn{width:78px;height:78px;border-radius:50%;background:var(--danger);border:0;color:#fff;font-size:26px;margin:0 auto;display:block;box-shadow:0 0 0 8px rgba(194,72,58,.12)}

.grade-grid{display:grid;grid-template-columns:220px 1fr 250px;gap:16px}
.rubric-item{border:1px solid var(--border);border-radius:11px;padding:13px;margin-bottom:12px}

.score-input{display:flex;align-items:center;gap:8px}

.vs-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}

.stu-list{display:flex;flex-direction:column;gap:6px}
.stu-item{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13px;cursor:pointer;background:#fff;text-align:left;width:100%}
.stu-item.on{border-color:var(--admin);background:var(--admin-bg)}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tabs button{border:0;background:transparent;padding:9px 16px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}

.grade-badge{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--admin);color:#fff;font-weight:900;font-size:15px}
.grade-badge.sm{width:28px;height:28px;font-size:12px;border-radius:8px}

.perm-note{font-size:12px;color:var(--muted);background:var(--border-2);border-radius:9px;padding:9px 12px;margin-top:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:300;box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;transition:.25s;pointer-events:none}

.modal .m-ic{font-size:38px}.modal h3{font-size:17px;margin:12px 0 6px}.modal p{font-size:13px;color:var(--muted);margin-bottom:18px}

  .grade-grid{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}
  .app{flex-direction:column}.sidebar{width:100%}.nav{flex-direction:row;flex-wrap:wrap}

</style>

<script>

const CODE = 'YSKLI-2026-A1';
const AREAS = ['vocab','listening','reading','speaking','writing'];

const QUESTIONS = {
  vocab:[
    {q:'어제 친구____ 영화를 봤어요.', c:['을','와','에서','으로'], a:1},

    {q:'학교에 가____ 우연히 친구를 만났어요.', c:['다가','으려고','기 전에','거나'], a:0},
    {q:'이 우산은 제____ 아닙니다.', c:['가','것이','에게','한테'], a:1},
    {q:'비가 ____ 우산을 꼭 가져가세요.', c:['오면','오니까','와도','오거나'], a:0},
    {q:'저는 매운 음식을 잘 먹____ 못해요.', c:['지','고','기','게'], a:0},
    {q:'숙제를 다 ____ 후에 게임을 할 거예요.', c:['하는','한','할','하고'], a:1},

  reading:[

function fillExam(stu, correctCounts, speakResp, writeResp){
  stu.progress='submitted';
  ['vocab','listening','reading'].forEach(area=>{
    const qs=QUESTIONS[area]; const ans=[];
    let need=correctCounts[area];
    qs.forEach((qq)=>{ if(need>0){ans.push(qq.a); need--;} else {ans.push((qq.a+1)%4);} });
    stu.answers[area]=ans;
  });
  stu.responses.speaking=speakResp; stu.responses.writing=writeResp;
  computeAuto(stu); computeAI(stu);
}

/* =========================================================
   3) 채점 로직 (실제 계산)
   ========================================================= */
function areaAutoScore(stu,area){
  const qs=QUESTIONS[area], ans=stu.answers[area]||[];
  let correct=0; qs.forEach((q,i)=>{ if(ans[i]===q.a) correct++; });
  return {correct, total:qs.length, score:Math.round(correct/qs.length*DB.settings.weights[area])};
}
function computeAuto(stu){
  stu.auto={};
  ['vocab','listening','reading'].forEach(a=> stu.auto[a]=areaAutoScore(stu,a));
  const vc=stu.auto.vocab;
  stu.vocabRaw60 = Math.round(vc.correct/vc.total*60);   // 어휘/어법 원점수 60점 환산
  const vp = vc.correct/vc.total;
  stu.level = vp>=0.8?'고급 (상)': vp>=0.5?'중급 (중)':'초급 (하)';
}
function aiItem(len, base){ return Math.max(1, Math.min(5, base + Math.floor(len/45))); }
function aiFromSec(s){ return Math.max(1, Math.min(5, 2 + Math.floor(Math.max(0,s)/18))); } // 녹음 길이 기반
function computeAI(stu){
  const sSec=(stu.responses.speaking.sec||0);
  const wLen=(stu.responses.writing.text||'').length;
  stu.ai={
    speaking:{f:aiFromSec(sSec), o:aiFromSec(sSec-8)},
    writing:{o:aiItem(wLen,2), a:aiItem(wLen,2)},
  };
}
function gradeHumanFor(stu){
  if(!stu.ai) computeAI(stu);
  stu.human.speaking={i1:Math.min(5,stu.ai.speaking.f+1), i2:stu.ai.speaking.o, confirmed:true};
  stu.human.writing ={i1:stu.ai.writing.o, i2:Math.min(5,stu.ai.writing.a+1), confirmed:true};
}
function humanArea20(stu,area){
  const h=stu.human[area]; if(!h||!h.confirmed) return null;
  return Math.round((h.i1+h.i2)/10*DB.settings.weights[area]);
}
function totalScore(stu){
  if(!stu.auto) return null;
  const sp=humanArea20(stu,'speaking'), wr=humanArea20(stu,'writing');
  if(sp==null||wr==null) return null;
  const parts=[stu.auto.vocab.score,stu.auto.listening.score,stu.auto.reading.score,sp,wr];
  if(DB.settings.rule==='min'){
    const total=DB.settings.weights, maxEach=Math.max(...AREAS.map(a=>total[a]));
    const norm=parts.map((p,i)=>p/[total.vocab,total.listening,total.reading,total.speaking,total.writing][i]);
    return Math.round(Math.min(...norm)*100);
  }
  return parts.reduce((x,y)=>x+y,0);
}
function gradeFromTotal(total){
  if(total==null) return null;
  const cl=DB.settings.cutlines;
  for(let g=8;g>=1;g--){ if(total>=cl[g]) return g; }
  return 1;
}
/* ---------------------------------------------------------
   정밀 매핑: 어휘/어법 원점수(0~60) → 8단계 배정 (연세대 표 그대로)
   - 급수가 어휘/어법 점수로 결정되고, 나머지 영역은 그 급수 난이도로 출제(적응형)
   - 1상은 말하기·쓰기 환산 점수 각 1점 이상 조건
   - 12~17 구간은 반말 앎/모름에 따라 세부 단계가 갈림
   --------------------------------------------------------- */
const VOCAB_BAND=[
  {min:0, max:0,  g:1,sub:'하'},
  {min:1, max:2,  g:1,sub:'상', cond:'말하기·쓰기 환산 각 1점 이상'},
  {min:3, max:5,  g:2,sub:'하'},
  {min:6, max:7,  g:2,sub:'상'},
  {min:8, max:11, g:3,sub:'하'},
  {min:12,max:15, g:3,sub:'상', note:'비격식체 반말 모름', alt:{g:4,sub:'하',cond:'비격식체 반말 앎'}},
  {min:16,max:17, g:4,sub:'상', note:'격식체 반말 모름',   alt:{g:5,sub:'하',cond:'격식체 반말 앎'}},
  {min:18,max:21, g:5,sub:'상'},
  {min:22,max:25, g:6,sub:'하'},
  {min:26,max:27, g:6,sub:'중'},
  {min:28,max:31, g:6,sub:'상'},
  {min:32,max:35, g:7,sub:'하'},
  {min:36,max:37, g:7,sub:'중'},
  {min:38,max:41, g:7,sub:'상'},
  {min:42,max:45, g:8,sub:'하'},
  {min:46,max:47, g:8,sub:'중'},
  {min:48,max:60, g:8,sub:'상'},
];
function bandOf(score60){ const s=Math.max(0,Math.min(60,score60|0)); return VOCAB_BAND.find(b=>s>=b.min&&s<=b.max)||VOCAB_BAND[0]; }
function placeByVocab(score60,opts){
  opts=opts||{}; const b=bandOf(score60);
  let g=b.g, sub=b.sub, note=b.note||null;
  if(b.alt && opts.banmal){ g=b.alt.g; sub=b.alt.sub; note=b.alt.cond; }
  if(b.cond && opts.spwrOk===false){ const i=VOCAB_BAND.indexOf(b); const lo=VOCAB_BAND[Math.max(0,i-1)]; g=lo.g; sub=lo.sub; note='말·쓰기 환산 미달로 하향'; }
  return {g,sub,label:g+'급 '+sub,cond:b.cond||null,note,band:b};
}
function placement(stu){
  if(stu.vocabRaw60==null) return null;
  const sp=humanArea20(stu,'speaking'), wr=humanArea20(stu,'writing');
  const spwrOk=(sp!=null&&wr!=null)?(sp>=1&&wr>=1):true;
  return placeByVocab(stu.vocabRaw60,{banmal:!!stu.banmal,spwrOk});
}
function gradeChipStu(stu,small){
  const p=placement(stu); if(!p) return '<span class="pill warn no">대기</span>';
  return `<span style="display:inline-flex;align-items:center;gap:5px"><span class="grade-badge ${small?'sm':''}">${p.g}급</span><b class="small" style="color:var(--admin)">${p.sub}</b></span>`;
}
function areaGradeLabel(stu,area){
  const sc=areaScore20(stu,area); if(sc==null) return null;
  return placeByVocab(Math.round(sc/DB.settings.weights[area]*60),{}).label;
}
function assignClass(stu){
  const p=placement(stu); stu.assignedGrade=p?p.g:null; stu.assignedSub=p?p.sub:null;
  stu.assignedClass = p? (p.g+'급 '+p.sub+'반') : null;
}
function areaScore20(stu,area){
  if(area==='speaking'||area==='writing') return humanArea20(stu,area);
  return stu.auto? stu.auto[area].score : null;
}

function stuResult(me){
  const graded=isFullyGraded(me);
  const areaRow=(area)=>{
    const sc=areaScore20(me,area);
    const pending=(area==='speaking'||area==='writing')&&sc==null;
    const pct=sc!=null?Math.round(sc/DB.settings.weights[area]*100):null;
    return `<div class="pcard" style="padding:11px 13px;display:flex;align-items:center;gap:10px">
      <b style="flex:1">${AREA_KO[area]}</b>
      ${pending?'<span class="pill warn no">채점 대기</span>':`<span class="mono muted small">${sc}/${DB.settings.weights[area]}점 · ${pct}%</span> <span class="pill admin no" style="font-size:10.5px">${areaGradeLabel(me,area)}</span>`}</div>`;
  };
  let head;
  if(graded){
    const t=totalScore(me); const p=placement(me);
    head=`<div class="ai-card"><div class="ai-h">✦ 최종 결과</div>
      <div class="row-between"><span class="small muted">종합 급수</span>${gradeChipStu(me,false)}</div>
      <div class="row-between mt"><span class="small muted">어휘·문법 원점수</span><span class="mono" style="font-weight:800">${me.vocabRaw60}/60 → ${p.label}</span></div>
      <div class="row-between mt"><span class="small muted">참고 총점(5영역)</span><span class="mono">${t} / 100</span></div>
      <div class="row-between mt"><span class="small muted">배정 반</span><span>${me.classConfirmed&&me.assignedClass?('<b>'+me.assignedClass+'</b>'):'<span class="pill admin no">배정 대기</span>'}</span></div>
      ${p.note?`<div class="perm-note" style="margin-top:8px">세부 단계 근거: ${p.note}</div>`:''}
      <p class="small mt2" style="line-height:1.7">${aiFeedback(me)}</p></div>
      <div id="radarBox" class="mt2 center"></div>
      <div class="radar-legend"><span><i style="background:var(--admin)"></i> 내 성취도</span><span><i style="border-top:2px dashed var(--muted);height:0"></i> 응시자 평균</span></div>`;
  } else {
    head=`<div class="pcard center" style="background:var(--border-2)"><div class="small muted">종합 급수 · 레이더</div><div style="font-size:15px;font-weight:900;margin-top:6px;color:var(--warn)">말하기·쓰기 확정 후 공개</div>
      <p class="small muted mt">👉 상단 <b>관리자·강사 탭</b>에서 채점하면 여기서 최종 결과가 열립니다.</p></div>`;
  }
  return `<h2 style="font-size:17px">내 결과</h2>
  <div class="mt">${head}</div>
  <p class="small muted mt2" style="font-weight:700">영역별</p>
  <div class="mt" style="display:flex;flex-direction:column;gap:7px">${AREAS.map(areaRow).join('')}</div>
  <button class="btn ghost block mt2" onclick="go('home')">← 홈으로</button>`;
}
function aiFeedback(me){
  const p=placement(me); const lbl=p?p.label:'';
  const weak=AREAS.map(a=>({a,s:areaScore20(me,a)||0})).sort((x,y)=>x.s-y.s)[0];
  return `현재 <b>${lbl}</b> 수준입니다(어휘·문법 원점수 ${me.vocabRaw60}/60 기준 배치). 정규 <b style="color:var(--student)">${lbl}반</b> 수업을 권장합니다. 상대적으로 <b style="color:var(--danger)">${AREA_KO[weak.a]}</b> 영역 보완이 필요해 보입니다.`;
}

function getStudent(id){ return DB.students.find(s=>s.id===id); }
function isFullyGraded(me){ return me.progress==='submitted' && me.human.speaking&&me.human.speaking.confirmed && me.human.writing&&me.human.writing.confirmed; }
function go(step){ session.step=step; render(); }
function doLogin(){
  const name=(document.getElementById('au_name').value||'').trim()||'응시자';
  const uname=(document.getElementById('au_id').value||'').trim()||'user';
  const code=(document.getElementById('au_code').value||'').trim();
  if(code!==CODE){ toast('❌ 인증코드가 올바르지 않습니다 (예: '+CODE+')'); return; }
  let me=DB.students.find(s=>s.username===uname);
  if(!me){ me=newStudent('me_'+Object.keys(DB.students).length+'_'+uname,name,uname); me.joined=true; DB.students.push(me); }
  else { me.joined=true; me.name=name; }
  session.me=me.id; session.step='home'; toast('✓ 로그인 완료 · 배치고사 세팅됨'); render();
}
function startExam(){
  const me=getStudent(session.me);
  me.progress='in_progress';
  session.draft={vocab:new Array(QUESTIONS.vocab.length).fill(null),
                 listening:new Array(QUESTIONS.listening.length).fill(null),
                 reading:new Array(QUESTIONS.reading.length).fill(null),
                 speaking:{sec:0}, writing:{photo:false,text:''}};
  session.qi=0; session.examStart=Date.now(); go('vocab');
}
function pick(area,qi,i){ session.draft[area][qi]=i; render(); }
function nextQ(area){
  const qs=QUESTIONS[area];
  if(session.qi<qs.length-1){ session.qi++; render(); }
  else { const ni=STEP_ORDER.indexOf(area)+1; session.qi=0; go(STEP_ORDER[ni]); }
}
function prevQ(){ if(session.qi>0){session.qi--; render();} }
function playAudio(qi){ const el=document.getElementById('audioText_'+qi); if(el) el.style.display=el.style.display==='none'?'block':'none'; }
function toggleRec(){
  if(session.recording){
    clearInterval(session.recTimer); session.recording=false; session.draft.speaking.sec=session.recSec;
    render();
  } else {
    session.recording=true; session.recSec=0;
    session.recTimer=setInterval(()=>{ session.recSec++; const el=document.getElementById('recTime'); if(el) el.textContent=fmt(session.recSec); if(session.recSec>=90){toggleRec();} },1000);
    render();
  }
}
function saveSpeaking(){
  if(session.recording) toggleRec();
  if(!(session.draft.speaking.sec>0)){ toast('먼저 녹음해 주세요'); return; }
  go('writing');
}
function submitExam(){
  const el=document.getElementById('wr_text'); if(el) session.draft.writing.text=(el.value||'').trim();
  const ok=document.getElementById('wr_ok');
  if(ok && !ok.checked){ toast('OCR 인식 결과를 확인해 주세요'); return; }
  openModal({ic:'📝',title:'정말 제출하시겠습니까?',body:'제출 후에는 답안을 수정할 수 없습니다. 말하기·쓰기는 채점 후 결과가 공개됩니다.',yes:'네, 제출합니다',onYes:()=>{
    const me=getStudent(session.me);
    me.answers={vocab:session.draft.vocab,listening:session.draft.listening,reading:session.draft.reading};
    me.responses={speaking:session.draft.speaking, writing:session.draft.writing};
    me.progress='submitted';
    computeAuto(me); computeAI(me);
    closeModal(); go('submitted'); toast('✓ 제출 완료 · 자동채점 반영됨');
  }});
}
function examTimer(){ if(!session.examStart) return '00:00'; return fmt(Math.floor((Date.now()-session.examStart)/1000)); }
function fmt(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }

        <div id="simNote" class="small muted" style="margin-top:4px">${sim0.note?sim0.note:''}</div>
      </div>
      <div class="perm-note">💡 실제로는 어휘·문법 60문항. 목업은 10문항을 60점으로 환산해 이 표를 적용합니다.</div>
      <h3 style="font-size:14px;margin-top:18px">영역별 배점 <span class="muted small">(참고 총점용, 합계 ${sum})</span></h3>
      <div class="tbl-wrap mt" style="box-shadow:none"><table style="min-width:auto"><thead><tr><th>영역</th><th>배점</th></tr></thead><tbody>
      ${AREAS.map(a=>`<tr><td>${AREA_KO[a]}</td><td><input class="input" style="width:70px" type="number" value="${w[a]}" onchange="setWeight('${a}',this.value)"></td></tr>`).join('')}
      <tr style="font-weight:800"><td>합계</td><td class="mono" style="padding-left:14px;color:${sum===100?'var(--ok)':'var(--danger)'}">${sum}</td></tr></tbody></table></div>
    </div>
    <div class="card"><h3 style="font-size:14px">정밀 매핑 표 <span class="muted small">· 어휘/어법 원점수 → 8단계 배정 (연세대)</span></h3>
      <div class="tbl-wrap mt" style="box-shadow:none"><table style="min-width:auto"><thead><tr><th>원점수</th><th>8단계 배정</th></tr></thead><tbody>${VOCAB_BAND.map(bandRow).join('')}</tbody></table></div>
      <div class="perm-note">· 12~17점대는 <b>반말 앎/모름</b>에 따라 세부 단계가 상향(채점 화면에서 토글).<br>· <b>1급 상</b>은 말하기·쓰기 환산 점수 각 1점 이상 조건. <span class="muted">(48~60 구간 세부 배정은 확인 필요 표기 — 현재 8급 상 처리)</span></div>
    </div>
  </div>`;
}
function simPlace(){ const el=document.getElementById('simScore'); if(!el) return; const p=placeByVocab(+el.value,{}); const o=document.getElementById('simOut'), n=document.getElementById('simNote'); if(o)o.textContent=p.label; if(n)n.textContent=p.note||''; }
function setWeight(a,v){ DB.settings.weights[a]=parseInt(v)||0; DB.students.forEach(s=>{if(s.auto)computeAuto(s);}); renderStaff(); }

/* =========================================================
   7) 공통 UI
   ========================================================= */
function seg(btn){ [...btn.parentElement.children].forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2200); }
function openModal(o){ document.getElementById('mIc').textContent=o.ic; document.getElementById('mTitle').textContent=o.title; document.getElementById('mBody').textContent=o.body; document.getElementById('mYes').textContent=o.yes; document.getElementById('mYes').onclick=o.onYes; document.getElementById('modal').classList.add('on'); }
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
function resetAll(){ openModal({ic:'↻',title:'처음부터 다시?',body:'모든 시뮬레이션 데이터가 초기화됩니다.',yes:'초기화',onYes:()=>{seed(); document.getElementById('roleTabs').children[0].click(); closeModal(); toast('초기 상태로 리셋됨');}}); }

document.getElementById('roleTabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...b.parentElement.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  session.role=b.dataset.role;
  document.getElementById('subRole').classList.toggle('hidden', session.role!=='staff');
  render();
});
document.getElementById('subRole').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...b.parentElement.children].forEach(x=>x.classList.remove('on','admin','instructor'));
  b.classList.add('on',b.dataset.sub); session.sub=b.dataset.sub; renderStaff(); updateHint();
});

document.addEventListener('input',e=>{ if(e.target.id==='wr_text'){ const c=document.getElementById('wr_count'); if(c)c.textContent=e.target.value.length; } });

function drawRadarIfAny(){
  const box=document.getElementById('radarBox'); if(!box) return;
  const me=getStudent(session.me); if(!me||!isFullyGraded(me)) return;
  const axes=['어휘문법','읽기','듣기','말하기','쓰기'];
  const order=['vocab','reading','listening','speaking','writing'];
  const me5=order.map(a=>{const v=areaScore20(me,a)||0; return v/DB.settings.weights[a];});
  const avg=[0.62,0.60,0.66,0.58,0.55];
  box.innerHTML=radarSVG(axes,me5,avg);
}
function radarSVG(axes,me,avg){
  const size=210,cx=size/2,cy=size/2,R=76;
  const pt=(i,r)=>{const ang=-Math.PI/2+i*2*Math.PI/5;return [cx+Math.cos(ang)*R*r,cy+Math.sin(ang)*R*r];};
  const poly=v=>v.map((x,i)=>pt(i,x).join(',')).join(' ');
  let grid='';[0.25,0.5,0.75,1].forEach(r=>grid+=`<polygon points="${poly([r,r,r,r,r])}" fill="none" stroke="#dde3ea"/>`);
  let sp='',lb='';for(let i=0;i<5;i++){const p=pt(i,1);sp+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#dde3ea"/>`;const l=pt(i,1.22);lb+=`<text x="${l[0]}" y="${l[1]}" font-size="10" fill="#697586" font-weight="700" text-anchor="middle" dominant-baseline="middle">${axes[i]}</text>`;}
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="overflow:visible">${grid}${sp}
    <polygon points="${poly(avg)}" fill="none" stroke="#697586" stroke-width="1.5" stroke-dasharray="4 3"/>
    <polygon points="${poly(me)}" fill="rgba(106,75,208,.22)" stroke="#6a4bd0" stroke-width="2"/>
    ${me.map((v,i)=>{const p=pt(i,v);return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#6a4bd0"/>`}).join('')}${lb}</svg>`;
}

seed(); render();
</script>
